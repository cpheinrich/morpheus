name: Firebase backend release
on:
  workflow_run:
    workflows: [Firebase emulator tests]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      source-sha:
        description: Full current main commit to test and deploy
        required: true
      environment:
        type: choice
        options: [staging, production]
        default: staging
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: firebase-client-release
  cancel-in-progress: false
jobs:
  source:
    uses: cpheinrich/morpheus/.github/workflows/release-preflight.yml@main
  tests:
    needs: source
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - name: Bind manual test source to release preflight
        env:
          REQUESTED_SHA: ${{ inputs.source-sha }}
          VERIFIED_SHA: ${{ needs.source.outputs.sha }}
        run: test "$REQUESTED_SHA" = "$VERIFIED_SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: "21"
      # Use the caller's pinned package manager and actual emulator/E2E contract.
      - run: corepack enable && pnpm install --frozen-lockfile
      - run: npm install --global firebase-tools@15.29.0
      - run: pnpm run test:emulator
  deploy:
    needs: [source, tests]
    if: >-
      !cancelled() && needs.source.result == 'success' && github.ref == 'refs/heads/main' &&
      ((github.event_name == 'workflow_dispatch' && needs.tests.result == 'success') ||
       (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: firebase-${{ inputs.environment || 'staging' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - name: Bind successful test source to release preflight
        env:
          REQUESTED_SHA: ${{ github.event.workflow_run.head_sha || inputs.source-sha }}
          VERIFIED_SHA: ${{ needs.source.outputs.sha }}
        run: test "$REQUESTED_SHA" = "$VERIFIED_SHA"
      - uses: cpheinrich/morpheus/.github/actions/firebase-release@main
        with:
          operation: deploy
          source-sha: ${{ needs.source.outputs.sha }}
          tests-result: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion || needs.tests.result }}
          policy-file: infra/firebase/release-policy.json
          environment: ${{ inputs.environment || 'staging' }}
          deploy-credentials-json: ${{ secrets.FIREBASE_DEPLOY_CREDENTIALS_JSON }}
          verifier-credentials-json: ${{ secrets.FIREBASE_VERIFIER_CREDENTIALS_JSON }}
