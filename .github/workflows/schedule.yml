name: Schedule

# Morpheus's own heartbeat, now run by hand only. It calls the same reusable
# workflow it ships, so a broken heartbeat still breaks here first.
#
# The hourly cron was removed deliberately on Chris's instruction (2026-11-03):
# recurring runs move to repository-owned schedules in .morpheus/schedules.json,
# dispatched by the shared scheduler (docs/runbooks/scheduler.md), and Morpheus
# registers none. Re-enable by adding an entry there, not a cron here.
on:
  workflow_dispatch:

jobs:
  heartbeat:
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/heartbeat.yml
    with:
      product-dir: hq/product
      morpheus-ref: ${{ github.sha }}
