name: Schedule

# Morpheus's own scheduled runs — the counterpart to ci.yml, which covers
# push and pull_request. It calls the same reusable workflows it ships, so a
# broken schedule breaks here first.
#
# Twice on weekdays, matching the inbox rhythm: a beat is only useful at a
# cadence a human actually reads.

# Hourly, every day — Chris's call: "if there is nothing to do then it is
# cheap." It is. The beat is a deterministic ranking function with no model in
# it, so a run that picks nothing costs a runner minute and writes a job
# summary. That is the property that makes this cadence affordable, and it is
# the reason assess was built as a ranker rather than a prompt.
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  heartbeat:
    uses: ./.github/workflows/heartbeat.yml
    with:
      product-dir: hq/product
      morpheus-ref: ${{ github.sha }}
