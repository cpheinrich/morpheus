name: iOS nightly TestFlight build

# Reusable release workflow for native Apple apps. The calling repository owns
# the schedule, watched paths, and app-specific upload policy. A scheduled run
# spends a macOS runner only when those paths changed since this caller workflow
# last uploaded successfully. Cross-repository callers keep environment-secret
# signing in a caller-owned job by disabling this workflow's upload job and
# consuming its verified outputs.

on:
  workflow_call:
    outputs:
      build:
        description: For opted-in releases, whether source, version and tests passed this attempt; otherwise the change decision.
        value: ${{ inputs.check-app-store-version && (jobs.release-ready.outputs.check-attempt == github.run_attempt && jobs.release-ready.outputs.build || 'false') || jobs.changes.outputs.build }}
      sha:
        description: Exact eligible release SHA when opted in; otherwise the preflight SHA.
        value: ${{ !inputs.check-app-store-version && jobs.preflight.outputs.sha || jobs.release-ready.outputs.check-attempt == github.run_attempt && jobs.release-ready.outputs.sha || '' }}
      check-attempt:
        description: Attempt that checked the eligible release; caller-owned upload must compare this with github.run_attempt.
        value: ${{ jobs.release-ready.outputs.check-attempt }}
      archive-version:
        description: Exact resolved marketing version of an eligible opted-in release.
        value: ${{ jobs.release-ready.outputs.archive-version }}
    inputs:
      actions-ref:
        description: >
          The cpheinrich/morpheus revision whose composite actions the version check and ios-ci.yml
          use. A consumer pinning this workflow to a commit passes the same commit.
        type: string
        required: false
        default: main
      workflow-file:
        description: Caller workflow filename whose latest successful run is the change baseline.
        type: string
        required: true
      watch-paths:
        description: Newline-separated repository paths whose changes require a build.
        type: string
        required: true
      force-build:
        description: Ignore the successful-run baseline and build this invocation.
        type: boolean
        default: false
      runner:
        description: GitHub-hosted image or self-hosted runner label used for testing and release.
        type: string
        default: "macos-26-xlarge"
      test-timeout-minutes:
        description: Maximum duration of the delegated iOS test job.
        type: number
        default: 45
      upload-timeout-minutes:
        description: Maximum duration of the signed archive and upload job.
        type: number
        default: 60
      xcode-version:
        description: Exact Xcode version installed as /Applications/Xcode_<version>.app.
        type: string
        default: "26.6"
      working-directory:
        description: Directory containing the Xcode project.
        type: string
        default: "apps/ios"
      project:
        description: Xcode project path, relative to working-directory.
        type: string
        required: true
      scheme:
        description: Shared scheme tested and archived for release.
        type: string
        required: true
      destination:
        description: Simulator destination qualifiers appended after platform.
        type: string
        default: "OS=26.5,name=iPhone 17 Pro Max"
      parallel-testing:
        description: Allow Xcode to run test targets in parallel.
        type: boolean
        default: true
      maximum-parallel-testing-workers:
        description: Maximum simulator test workers when parallel testing is enabled; zero lets Xcode decide.
        type: number
        default: 6
      optimize-test-build:
        description: Forwarded to ios-ci.yml; see its input of the same name.
        type: boolean
        default: false
      firebase-emulators:
        description: Run the delegated test action inside Firebase Emulator Suite.
        type: boolean
        default: false
      firebase-cli-version:
        description: Exact firebase-tools version installed when Firebase emulators are enabled.
        type: string
        default: "15.28.1"
      firebase-config:
        description: Firebase config path relative to the caller repository root.
        type: string
        default: "firebase.json"
      firebase-project:
        description: Synthetic Firebase project id used by the emulator-backed test run.
        type: string
        default: "demo-ios-ci"
      firebase-only:
        description: Comma-separated Firebase emulators needed by the iOS tests.
        type: string
        default: "auth,firestore"
      test-iterations:
        description: Forwarded to ios-ci.yml; see its input of the same name.
        type: number
        default: 3
      only-testing:
        description: >
          Forwarded to ios-ci.yml: newline-separated xcodebuild -only-testing identifiers
          (TestTarget[/TestClass[/testMethod]]) that narrow the release's test stage. Empty,
          the default, keeps the complete scheme. The caller decides what a release may narrow
          and when; a caller that exposes this should keep it off its production path.
        type: string
        default: ""
      skip-testing:
        description: >
          Forwarded to ios-ci.yml: newline-separated xcodebuild -skip-testing identifiers
          left out of the release's test stage. Empty, the default, skips nothing. Same
          caveat as only-testing.
        type: string
        default: ""
      test-evidence-script:
        description: Optional caller-repository result validator; full nightly selection is unchanged.
        type: string
        default: ""
      pre-test-script:
        description: Optional caller-repository script run immediately before tests.
        type: string
        default: ""
      capture-every-night:
        description: Run simulator tests even without release changes, so each day's screenshots and results are current.
        type: boolean
        default: false
      schedule-timezone:
        description: IANA timezone used to deduplicate daily screenshots across scheduled retries.
        type: string
        default: UTC
      run-upload:
        description: >
          Run the upload job in this workflow. Cross-repository callers whose credentials are
          environment secrets must disable this and upload from a caller-owned environment job.
        type: boolean
        default: true
      environment:
        description: Protected environment used only when run-upload is enabled.
        type: string
        default: "testflight-internal"
      upload-script:
        description: >
          Executable repository-relative script that archives, signs, and uploads. Required only
          when run-upload is enabled; a caller that uploads from its own environment job uses the
          ios-testflight-upload action instead and passes nothing here.
        type: string
        default: ""
      source-packages-directory:
        description: Runner-temp subdirectory shared with the upload script for SwiftPM caching.
        type: string
        default: "TestFlightSourcePackages"
      check-app-store-version:
        description: >
          Require the verified release candidate to be ahead of the public App Store version.
          Requires explicit ios-bundle-id and app-store-connect-app-id, even with run-upload false.
        type: boolean
        default: false
      archive-configuration:
        description: Explicit configuration for the opt-in archive metadata query and upload; ignored if not opted in.
        type: string
        default: Release
      app-store-storefront:
        description: Two-letter country for the public listing used by the opt-in version check.
        type: string
        default: us
      apple-team-id:
        description: Fallback Apple team id when IOS_APPLE_TEAM_ID is not set in the environment.
        type: string
        default: ""
      ios-bundle-id:
        description: Explicit public bundle ID for the version check; upload fallback for IOS_BUNDLE_ID.
        type: string
        default: ""
      app-store-connect-app-id:
        description: Public numeric app ID for the version check and the upload script.
        type: string
        default: ""
      testflight-beta-group-ids:
        description: Newline-separated TestFlight beta-group ids assigned after processing.
        type: string
        default: ""
      sentry-org:
        description: Optional fallback Sentry organization for debug-symbol upload.
        type: string
        default: ""
      sentry-project:
        description: Optional fallback Sentry project for debug-symbol upload.
        type: string
        default: ""
      install-sentry-cli:
        description: Install sentry-cli before the release credentials are exposed.
        type: boolean
        default: false
      download-metal-toolchain:
        description: Download Xcode's optional Metal toolchain before archiving.
        type: boolean
        default: false

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Check iOS changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      build: ${{ steps.decide.outputs.build }}
      capture: ${{ steps.capture.outputs.capture }}
      baseline: ${{ steps.decide.outputs.baseline }}
      reason: ${{ steps.decide.outputs.reason }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Compare with the last successful upload
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_SHA: ${{ github.sha }}
          FORCE_BUILD: ${{ inputs.force-build }}
          WATCH_PATHS: ${{ inputs.watch-paths }}
          WORKFLOW_FILE: ${{ inputs.workflow-file }}
        run: |
          set -euo pipefail

          build=true
          baseline=""
          reason=""

          if [ "$FORCE_BUILD" = "true" ]; then
            reason="forced by the caller"
          else
            if [[ ! "$WORKFLOW_FILE" =~ ^[A-Za-z0-9._-]+\.(yml|yaml)$ ]]; then
              echo "workflow-file must be a filename ending in .yml or .yaml" >&2
              exit 1
            fi

            paths=()
            while IFS= read -r path; do
              [ -z "$path" ] && continue
              case "$path" in
                /*|-*|*"../"*|*"/.."|"..")
                  echo "watch-paths entries must be relative paths without '..': $path" >&2
                  exit 1
                  ;;
              esac
              paths+=("$path")
            done <<< "$WATCH_PATHS"

            if [ "${#paths[@]}" -eq 0 ]; then
              echo "watch-paths must contain at least one path" >&2
              exit 1
            fi

            # The baseline is the newest successful run that actually uploaded, not merely the
            # newest successful run: an admission-only duplicate, an intentional no-op or a
            # test-only run also succeeds, and taking its head would skip a commit that never
            # reached TestFlight. An upload is a successful job in any attempt named `upload`
            # (a caller's job id), `Upload TestFlight build` (a caller's named job), or ending
            # `/ Upload TestFlight build` (this workflow's own job, prefixed by the caller's).
            upload_job='(.name == "upload" or .name == "Upload TestFlight build" or (.name | endswith("/ Upload TestFlight build"))) and .conclusion == "success"'
            find_upload() {
              local page runs id sha count
              for page in 1 2 3 4 5; do
                runs="$(gh api -H "Accept: application/vnd.github+json" \
                  "/repos/${GITHUB_REPOSITORY}/actions/workflows/${WORKFLOW_FILE}/runs?branch=main&status=success&per_page=20&page=${page}" \
                  --jq '.workflow_runs[] | "\(.id) \(.head_sha)"' </dev/null)" || return 1
                [ -z "$runs" ] && return 0
                while read -r id sha; do
                  count="$(gh api --paginate -H "Accept: application/vnd.github+json" \
                    "/repos/${GITHUB_REPOSITORY}/actions/runs/${id}/jobs?filter=all&per_page=100" \
                    --jq "[.jobs[] | select(${upload_job})] | length" </dev/null)" || return 1
                  if [ "$(awk '{ total += $1 } END { print total + 0 }' <<< "$count")" -gt 0 ]; then
                    printf '%s\n' "$sha"
                    return 0
                  fi
                done <<< "$runs"
              done
              return 0
            }

            if ! baseline="$(find_upload)"; then
              baseline=""
              reason="the upload baseline could not be read; building conservatively"
            elif [ -z "$baseline" ]; then
              reason="no successful upload found among the latest 100 successful runs"
            elif ! git cat-file -e "${baseline}^{commit}" 2>/dev/null; then
              reason="the last successful upload commit is unavailable; building conservatively"
            elif ! git merge-base --is-ancestor "$baseline" "$CURRENT_SHA"; then
              reason="the last successful upload is not an ancestor of main; building conservatively"
            else
              set +e
              git diff --quiet "$baseline" "$CURRENT_SHA" -- "${paths[@]}"
              diff_status=$?
              set -e

              case "$diff_status" in
                0)
                  build=false
                  reason="no watched iOS paths changed since the last successful upload"
                  ;;
                1)
                  reason="watched iOS paths changed since the last successful upload"
                  ;;
                *)
                  reason="the watched-path diff failed; building conservatively"
                  ;;
              esac
            fi
          fi

          {
            echo "build=$build"
            echo "baseline=$baseline"
            echo "reason=$reason"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Nightly iOS build decision"
            echo
            echo "- Build: \`$build\`"
            echo "- Reason: $reason"
            if [ -n "$baseline" ]; then
              echo "- Previous successful upload: \`$baseline\`"
            fi
            echo "- Candidate: \`$CURRENT_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # GitHub cron is best-effort. Callers can add morning retry triggers; a
      # completed capture of this exact source makes later retries inexpensive.
      - name: Check for an existing capture today
        id: capture
        if: inputs.capture-every-night && steps.decide.outputs.build == 'false'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          WORKFLOW_FILE: ${{ inputs.workflow-file }}
          SCHEDULE_TIMEZONE: ${{ inputs.schedule-timezone }}
        with:
          script: |
            const date = new Intl.DateTimeFormat('en-CA', {timeZone: process.env.SCHEDULE_TIMEZONE,
              year: 'numeric', month: '2-digit', day: '2-digit'});
            const today = date.format(new Date());
            let capture = true;
            try {
              const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
                ...context.repo, workflow_id: process.env.WORKFLOW_FILE, branch: 'main', status: 'success',
                created: `>=${new Date(Date.now() - 48 * 60 * 60 * 1000).toISOString()}`, per_page: 100});
              for (const run of runs) {
                if (run.id === context.runId || run.head_sha !== context.sha ||
                    !['schedule', 'workflow_dispatch'].includes(run.event) ||
                    date.format(new Date(run.created_at)) !== today) continue;
                const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts,
                  {...context.repo, run_id: run.id, per_page: 100});
                if (artifacts.some(a => a.name === `ios-screenshots-${run.id}-${run.run_attempt}` && !a.expired)) {
                  capture = false;
                  core.notice(`Today's screenshots for ${context.sha} already exist in run ${run.id}`);
                  break;
                }
              }
            } catch (error) {
              core.warning(`Could not verify today's capture; capturing conservatively: ${error.message}`);
            }
            core.setOutput('capture', String(capture));

      # Record an intentional skip, so a run with no screenshots is distinguishable from a failed capture.
      - name: Record intentional nightly no-op
        if: steps.decide.outputs.build == 'false' && steps.capture.outputs.capture != 'true'
        run: echo 'No release changes and no new capture required.' > "$RUNNER_TEMP/ios-nightly-noop.txt"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: steps.decide.outputs.build == 'false' && steps.capture.outputs.capture != 'true'
        with:
          name: ios-nightly-noop-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ios-nightly-noop.txt
          retention-days: 7
          if-no-files-found: error

  # Local references resolve inside this repository at this workflow's own commit, even when the
  # caller is another repository (verified 2026-10-14, cpheinrich/morpheus#393). A branch
  # reference here would float under a consumer's pin and let an unreviewed change into a release.
  preflight:
    name: Verify release source
    needs: changes
    if: ${{ needs.changes.outputs.build == 'true' }}
    uses: ./.github/workflows/release-preflight.yml

  version-check:
    name: Verify iOS App Store version
    needs: [changes, preflight]
    if: ${{ inputs.check-app-store-version && needs.changes.outputs.build == 'true' }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      attempt: ${{ steps.checked.outputs.attempt }}
      version: ${{ steps.identity.outputs.version }}
    steps:
      - name: Check out verified main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          persist-credentials: false
      - name: Check out this workflow's actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: cpheinrich/morpheus
          ref: ${{ inputs.actions-ref }}
          path: .morpheus-ci
          persist-credentials: false
          sparse-checkout: .github/actions/ios-app-store-version
      - name: Verify checkout and select Xcode for archive metadata
        env:
          EXPECTED_SHA: ${{ needs.preflight.outputs.sha }}
          XCODE_VERSION: ${{ inputs.xcode-version }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          [[ "$XCODE_VERSION" =~ ^[0-9]+(\.[0-9]+){1,2}$ ]]
          xcode_app="/Applications/Xcode_${XCODE_VERSION}.app"
          if [[ ! -d "$xcode_app" ]]; then xcode_app=/Applications/Xcode.app; fi
          developer_dir="$xcode_app/Contents/Developer"
          installed_version=$("$developer_dir/usr/bin/xcodebuild" -version | sed -n '1s/Xcode //p')
          if [[ "$installed_version" != "$XCODE_VERSION" ]]; then
            echo "Expected Xcode $XCODE_VERSION, but $xcode_app contains $installed_version" >&2
            exit 1
          fi
          echo "DEVELOPER_DIR=$developer_dir" >> "$GITHUB_ENV"
      - name: Resolve the installed iOS app's archive settings
        id: identity
        env:
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
          PROJECT: ${{ inputs.project }}
          SCHEME: ${{ inputs.scheme }}
          CONFIGURATION: ${{ inputs.archive-configuration }}
          BUNDLE_ID: ${{ inputs.ios-bundle-id }}
        run: |
          set -euo pipefail
          for relative_path in "$WORKING_DIRECTORY" "$PROJECT"; do
            case "$relative_path" in
              ""|/*|*"../"*|*"/.."|"..")
                echo "working-directory and project must be relative paths without '..'" >&2
                exit 1 ;;
            esac
          done
          if [[ -z "$SCHEME" || -z "$CONFIGURATION" || -n "${XCODE_XCCONFIG_FILE:-}" ]]; then
            echo 'Select a scheme and configuration without an external XCODE_XCCONFIG_FILE override.' >&2
            exit 1
          fi
          xcodebuild -showBuildSettings -json -project "$GITHUB_WORKSPACE/$WORKING_DIRECTORY/$PROJECT" \
            -scheme "$SCHEME" -configuration "$CONFIGURATION" -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/ios-version-check" \
            -disableAutomaticPackageResolution -onlyUsePackageVersionsFromResolvedFile archive |
          node --input-type=module -e '
            import { appendFileSync, readFileSync } from "node:fs";
            const apps = JSON.parse(readFileSync(0, "utf8")).filter(({action, buildSettings: settings}) =>
              action === "archive" && settings?.PRODUCT_TYPE === "com.apple.product-type.application" &&
              settings.PLATFORM_NAME === "iphoneos" && settings.SKIP_INSTALL === "NO");
            if (apps.length !== 1) throw new Error("Expected one installable iOS archive app; found " + apps.length);
            const settings = apps[0].buildSettings;
            if (settings.CONFIGURATION !== process.env.CONFIGURATION || !process.env.BUNDLE_ID ||
                settings.PRODUCT_BUNDLE_IDENTIFIER !== process.env.BUNDLE_ID) {
              throw new Error("Resolved archive configuration or app bundle ID does not match the version check inputs");
            }
            const version = settings.MARKETING_VERSION;
            if (typeof version !== "string" || !/^(?:0|[1-9][0-9]*)(?:\.(?:0|[1-9][0-9]*)){1,2}$/.test(version)) {
              throw new Error("Expected a literal numeric marketing version for the archive app");
            }
            appendFileSync(process.env.GITHUB_OUTPUT, "version=" + version + "\n");
          '
      - name: Check live App Store version
        uses: ./.morpheus-ci/.github/actions/ios-app-store-version
        with:
          version: ${{ steps.identity.outputs.version }}
          app-id: ${{ inputs.app-store-connect-app-id }}
          bundle-id: ${{ inputs.ios-bundle-id }}
          storefront: ${{ inputs.app-store-storefront }}
      - name: Record successful version check attempt
        id: checked
        env:
          CHECK_ATTEMPT: ${{ github.run_attempt }}
        run: echo "attempt=$CHECK_ATTEMPT" >> "$GITHUB_OUTPUT"

  test:
    name: Test before release
    needs: [changes, version-check]
    if: >-
      ${{ !cancelled() && needs.changes.result == 'success'
          && (needs.changes.outputs.build == 'true' || needs.changes.outputs.capture == 'true')
          && (!inputs.check-app-store-version || needs.changes.outputs.build != 'true'
              || needs.version-check.result == 'success') }}
    uses: ./.github/workflows/ios-ci.yml
    with:
      actions-ref: ${{ inputs.actions-ref }}
      runner: ${{ inputs.runner }}
      timeout-minutes: ${{ inputs.test-timeout-minutes }}
      xcode-version: ${{ inputs.xcode-version }}
      working-directory: ${{ inputs.working-directory }}
      project: ${{ inputs.project }}
      scheme: ${{ inputs.scheme }}
      destination: ${{ inputs.destination }}
      parallel-testing: ${{ inputs.parallel-testing }}
      maximum-parallel-testing-workers: ${{ inputs.parallel-testing && inputs.maximum-parallel-testing-workers || 0 }}
      optimize-test-build: ${{ inputs.optimize-test-build }}
      test-iterations: ${{ inputs.test-iterations }}
      only-testing: ${{ inputs.only-testing }}
      skip-testing: ${{ inputs.skip-testing }}
      firebase-emulators: ${{ inputs.firebase-emulators }}
      firebase-cli-version: ${{ inputs.firebase-cli-version }}
      firebase-config: ${{ inputs.firebase-config }}
      firebase-project: ${{ inputs.firebase-project }}
      firebase-only: ${{ inputs.firebase-only }}
      pre-test-script: ${{ inputs.pre-test-script }}
      test-evidence-script: ${{ inputs.test-evidence-script }}
      run-tests: true

  release-ready:
    name: Qualify opted-in release outputs
    needs: [changes, preflight, version-check, test]
    if: >-
      ${{ !cancelled() && inputs.check-app-store-version && needs.changes.result == 'success'
          && needs.changes.outputs.build == 'true' && needs.preflight.result == 'success'
          && needs.preflight.outputs.sha != '' && needs.test.result == 'success'
          && needs.version-check.result == 'success' && needs.version-check.outputs.version != ''
          && needs.version-check.outputs.attempt == github.run_attempt }}
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    permissions: {}
    outputs:
      build: ${{ steps.qualified.outputs.build }}
      sha: ${{ steps.qualified.outputs.sha }}
      check-attempt: ${{ steps.qualified.outputs.check-attempt }}
      archive-version: ${{ steps.qualified.outputs.archive-version }}
    steps:
      - id: qualified
        env:
          VERIFIED_SHA: ${{ needs.preflight.outputs.sha }}
          CHECK_ATTEMPT: ${{ needs.version-check.outputs.attempt }}
          ARCHIVE_VERSION: ${{ needs.version-check.outputs.version }}
        run: printf 'build=true\nsha=%s\ncheck-attempt=%s\narchive-version=%s\n' "$VERIFIED_SHA" "$CHECK_ATTEMPT" "$ARCHIVE_VERSION" >> "$GITHUB_OUTPUT"

  upload:
    name: Upload TestFlight build
    needs: [changes, preflight, test, release-ready]
    if: >-
      ${{ !cancelled() && inputs.run-upload && needs.changes.result == 'success'
          && needs.changes.outputs.build == 'true' && needs.preflight.result == 'success' && needs.test.result == 'success'
          && (!inputs.check-app-store-version || (needs.release-ready.result == 'success'
              && needs.release-ready.outputs.check-attempt == github.run_attempt)) }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.upload-timeout-minutes }}
    environment: ${{ inputs.environment }}
    env:
      APPLE_TEAM_ID: ${{ vars.IOS_APPLE_TEAM_ID || inputs.apple-team-id }}
      IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID || inputs.ios-bundle-id }}
      ASC_APP_ID: ${{ inputs.app-store-connect-app-id }}
      TESTFLIGHT_BETA_GROUP_IDS: ${{ inputs.testflight-beta-group-ids }}
      SENTRY_ORG: ${{ vars.SENTRY_ORG || inputs.sentry-org }}
      SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT || inputs.sentry-project }}
      SENTRY_DSN: ${{ vars.SENTRY_DSN }}
      PROJECT_PATH: ${{ github.workspace }}/${{ inputs.working-directory }}/${{ inputs.project }}
      SCHEME_NAME: ${{ inputs.scheme }}
      UPLOAD_SCRIPT: ${{ inputs.upload-script }}
    steps:
      - name: Check upload credential availability
        # Only presence flags enter this process; values stay in the final upload step.
        env:
          HAS_APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID != '' }}
          HAS_APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID != '' }}
          HAS_APP_STORE_CONNECT_API_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 != '' }}
          HAS_IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 != '' }}
          HAS_IOS_DISTRIBUTION_PROFILE_BASE64: ${{ secrets.IOS_DISTRIBUTION_PROFILE_BASE64 != '' }}
        run: |
          set -euo pipefail
          missing=()
          for key in HAS_APP_STORE_CONNECT_KEY_ID HAS_APP_STORE_CONNECT_ISSUER_ID HAS_APP_STORE_CONNECT_API_KEY_P8_BASE64 HAS_IOS_DISTRIBUTION_P12_BASE64 HAS_IOS_DISTRIBUTION_PROFILE_BASE64; do
            if [ "${!key}" != true ]; then
              missing+=("${key#HAS_}")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "Missing required upload secrets: ${missing[*]}" >&2
            echo "If these are caller environment secrets, a cross-repository workflow cannot read them. Set run-upload: false and use a caller-owned job in the protected environment, gated by the build/sha outputs, with ios-testflight-upload. Keep credentials in the protected environment." >&2
            exit 1
          fi

      - name: Check out verified main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Validate release inputs and select Xcode
        id: release_paths
        env:
          EXPECTED_SHA: ${{ needs.preflight.outputs.sha }}
          XCODE_VERSION: ${{ inputs.xcode-version }}
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
          PROJECT: ${{ inputs.project }}
          SOURCE_PACKAGES_DIRECTORY: ${{ inputs.source-packages-directory }}
          DOWNLOAD_METAL_TOOLCHAIN: ${{ inputs.download-metal-toolchain }}
        run: |
          set -euo pipefail

          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          if [[ ! "$XCODE_VERSION" =~ ^[0-9]+(\.[0-9]+){1,2}$ ]]; then
            echo "xcode-version must be an exact numeric version such as 26.6" >&2
            exit 1
          fi
          for relative_path in "$WORKING_DIRECTORY" "$PROJECT"; do
            case "$relative_path" in
              ""|/*|*"../"*|*"/.."|"..")
                echo "working-directory and project must be relative paths without '..'" >&2
                exit 1
                ;;
            esac
          done
          case "$UPLOAD_SCRIPT" in
            ""|/*|*"../"*|*"/.."|"..")
              echo "upload-script must be a repository-relative path without '..'" >&2
              exit 1
              ;;
          esac
          case "$SOURCE_PACKAGES_DIRECTORY" in
            ""|/*|*"/"*|"."|"..")
              echo "source-packages-directory must be one runner-temp directory name" >&2
              exit 1
              ;;
          esac
          if [ ! -x "$GITHUB_WORKSPACE/$UPLOAD_SCRIPT" ]; then
            echo "upload-script is missing or not executable: $UPLOAD_SCRIPT" >&2
            exit 1
          fi
          if [ ! -f "$PROJECT_PATH/project.pbxproj" ]; then
            echo "Xcode project not found at $PROJECT_PATH" >&2
            exit 1
          fi

          # Reuse a runner-provided build cache (see ios-ci.yml) for the release
          # checkouts too; a named directory that does not exist is ignored.
          if [ -n "${MORPHEUS_IOS_CI_CACHE:-}" ] && [ -d "$MORPHEUS_IOS_CI_CACHE" ]; then
            echo "SOURCE_PACKAGES_PATH=$MORPHEUS_IOS_CI_CACHE/$SOURCE_PACKAGES_DIRECTORY" >> "$GITHUB_ENV"
            echo "cached=true" >> "$GITHUB_OUTPUT"
          else
            echo "SOURCE_PACKAGES_PATH=$RUNNER_TEMP/$SOURCE_PACKAGES_DIRECTORY" >> "$GITHUB_ENV"
            echo "cached=false" >> "$GITHUB_OUTPUT"
          fi

          versioned_xcode_app="/Applications/Xcode_${XCODE_VERSION}.app"
          if [ -d "$versioned_xcode_app" ]; then
            xcode_app="$versioned_xcode_app"
          elif [ -d /Applications/Xcode.app ]; then
            xcode_app=/Applications/Xcode.app
          else
            echo "Xcode $XCODE_VERSION is not installed on this runner" >&2
            exit 1
          fi
          installed_version=$("$xcode_app/Contents/Developer/usr/bin/xcodebuild" -version | sed -n '1s/Xcode //p')
          if [ "$installed_version" != "$XCODE_VERSION" ]; then
            echo "Expected Xcode $XCODE_VERSION, but $xcode_app contains $installed_version" >&2
            exit 1
          fi
          echo "DEVELOPER_DIR=$xcode_app/Contents/Developer" >> "$GITHUB_ENV"
          "$xcode_app/Contents/Developer/usr/bin/xcodebuild" -version
          if [ "$DOWNLOAD_METAL_TOOLCHAIN" = "true" ]; then
            "$xcode_app/Contents/Developer/usr/bin/xcodebuild" -downloadComponent MetalToolchain
          fi

      - name: Cache resolved Swift packages
        # A runner-provided cache directory already keeps the checkouts.
        if: ${{ steps.release_paths.outputs.cached != 'true' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/${{ inputs.source-packages-directory }}
          key: nightly-testflight-spm-${{ runner.os }}-xcode-${{ inputs.xcode-version }}-${{ hashFiles(format('{0}/**/Package.resolved', inputs.working-directory)) }}
          restore-keys: |
            nightly-testflight-spm-${{ runner.os }}-xcode-${{ inputs.xcode-version }}-

      - name: Install release tooling
        env:
          ASCCLI_VERSION: "0.18.2"
          INSTALL_SENTRY_CLI: ${{ inputs.install-sentry-cli }}
        run: |
          set -euo pipefail
          if ! brew list --versions openssl@3 >/dev/null 2>&1; then
            brew install openssl@3
          fi
          case "$(uname -m)" in
            arm64)
              asccli_arch=arm64
              asccli_asset_id=478751700
              asccli_sha256=7555b910823d8935d9dd5df5fe0382c0ab2741437ed26a3c5b683d13dd19530c
              ;;
            x86_64)
              asccli_arch=x86_64
              asccli_asset_id=478751702
              asccli_sha256=c72907829723e4ff3a7b60d4c1d9be8755995d4aab9cf960aaf866b83169456c
              ;;
            *)
              echo "Unsupported macOS runner architecture: $(uname -m)" >&2
              exit 1
              ;;
          esac
          asccli_asset="asc_v${ASCCLI_VERSION}_macOS_${asccli_arch}"
          asccli_path="$RUNNER_TEMP/asccli"
          if ! curl --fail --location --retry 3 --silent --show-error \
              "https://github.com/tddworks/asc-cli/releases/download/v${ASCCLI_VERSION}/${asccli_asset}" \
              --output "$asccli_path"; then
            curl --fail --location --retry 3 --silent --show-error \
              --header 'Accept: application/octet-stream' \
              "https://api.github.com/repos/tddworks/asc-cli/releases/assets/${asccli_asset_id}" \
              --output "$asccli_path"
          fi
          printf '%s  %s\n' "$asccli_sha256" "$asccli_path" | shasum -a 256 --check
          chmod 755 "$asccli_path"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          "$asccli_path" --version
          if [ "$INSTALL_SENTRY_CLI" = "true" ] && ! command -v sentry-cli >/dev/null 2>&1; then
            brew install getsentry/tools/sentry-cli
          fi
          echo "OPENSSL_BINARY=$(brew --prefix openssl@3)/bin/openssl" >> "$GITHUB_ENV"

      # The protected environment's secrets first enter the process here,
      # after the exact-main gate, independent tests, checkout validation, and
      # release-tool installation have all completed.
      - name: Archive, sign, and upload to TestFlight
        env:
          CHECK_APP_STORE_VERSION: ${{ inputs.check-app-store-version }}
          CHECKED_BUNDLE_ID: ${{ inputs.ios-bundle-id }}
          CHECKED_CONFIGURATION: ${{ inputs.archive-configuration }}
          CHECKED_VERSION: ${{ needs.release-ready.outputs.archive-version }}
          ASC_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_DISTRIBUTION_PROFILE_BASE64: ${{ secrets.IOS_DISTRIBUTION_PROFILE_BASE64 }}
          IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          if [[ "$CHECK_APP_STORE_VERSION" == true ]]; then
            if [[ -z "$CHECKED_BUNDLE_ID" || "$IOS_BUNDLE_ID" != "$CHECKED_BUNDLE_ID" ]]; then
              echo "Effective IOS_BUNDLE_ID must match the bundle qualified by the App Store version check." >&2
              exit 1
            fi
            test -z "${XCODE_XCCONFIG_FILE:-}"
            export BUILD_CONFIGURATION="$CHECKED_CONFIGURATION" MARKETING_VERSION="$CHECKED_VERSION"
          fi
          "$GITHUB_WORKSPACE/$UPLOAD_SCRIPT"
