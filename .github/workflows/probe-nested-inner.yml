# Temporary probe for MO-26-10-13-17.34.56. Deleted before review.
name: probe nested inner
on:
  workflow_call:
jobs:
  facts:
    runs-on: ubuntu-latest
    steps:
      - run: echo "inner repository=${{ github.repository }} sha=${{ github.sha }} job_workflow_sha=${{ github.job_workflow_sha }} job_workflow_ref=${{ github.job_workflow_ref }} workflow_sha=${{ github.workflow_sha }} workflow_ref=${{ github.workflow_ref }}"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: cpheinrich/morpheus
          ref: ${{ github.job_workflow_sha }}
          path: .morpheus-ci
          persist-credentials: false
      - run: |
          echo "checked out morpheus at $(git -C .morpheus-ci rev-parse HEAD)"
          ls .morpheus-ci/.github/actions
