name: Node CI

# Reusable workflow. Projects delegate to this rather than copying CI logic:
#
#   jobs:
#     ci:
#       uses: cpheinrich/morpheus/.github/workflows/node-ci.yml@main
#
# Improving CI for every project is then one commit here.

on:
  workflow_call:
    inputs:
      run-check:
        description: Skip the inner job while retaining its reported check name.
        type: boolean
        default: true
      node-version:
        type: string
        default: "22"
      pnpm-version:
        description: >
          Leave empty to let package.json's `packageManager` field decide, which
          is the modern default. Setting both makes pnpm/action-setup fail with
          "Multiple versions of pnpm specified".
        type: string
        default: ""
      working-directory:
        type: string
        default: "."
      runner:
        description: >
          Single runner label for the job: a GitHub-hosted image
          (ubuntu-latest) or a self-hosted runner label such as linux-vm.
          One label, not JSON; the caller owns any fallback.
        type: string
        default: "ubuntu-latest"
      run-lint:
        type: boolean
        default: false
      run-workflow-lint:
        description: Validate all repository workflows with pinned actionlint (Linux X64).
        type: boolean
        default: false
      build-script:
        description: Package script that produces the deployable output.
        type: string
        default: "build"
      verify-build-clean:
        description: >
          Fail when the build changes committed output inside build-output-directory.
          Requires build-output-directory.
        type: boolean
        default: false
      build-output-directory:
        description: >
          Safe relative path to the tracked generated directory cleaned and checked by a
          verified build.
        type: string
        default: ""

jobs:
  check:
    if: ${{ inputs.run-check }}
    runs-on: ${{ inputs.runner }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ inputs.pnpm-version }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm
          cache-dependency-path: ${{ inputs.working-directory }}/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Validate GitHub Actions workflows
        if: ${{ inputs.run-workflow-lint }}
        working-directory: .
        timeout-minutes: 3
        run: |
          set -euo pipefail
          test "$RUNNER_OS/$RUNNER_ARCH" = Linux/X64
          tool_dir="$(mktemp -d "$RUNNER_TEMP/actionlint.XXXXXX")"
          curl --fail --silent --show-error --location --connect-timeout 15 --max-time 90 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$tool_dir/actionlint.tar.gz"
          printf '%s  %s\n' 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 "$tool_dir/actionlint.tar.gz" \
            | sha256sum --check --status
          tar -xzf "$tool_dir/actionlint.tar.gz" -C "$tool_dir" actionlint
          rm "$tool_dir/actionlint.tar.gz"
          "$tool_dir/actionlint" -version
          "$tool_dir/actionlint" -shellcheck= -pyflakes=
          echo "$tool_dir" >> "$GITHUB_PATH"

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        if: ${{ inputs.run-lint }}
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Clean committed build output
        if: ${{ inputs.verify-build-clean && inputs.build-output-directory != '' }}
        env:
          BUILD_OUTPUT_DIRECTORY: ${{ inputs.build-output-directory }}
        run: |
          case "$BUILD_OUTPUT_DIRECTORY" in
            "."|"/"|/*|*".."*|*"*"*|*"?"*|*"["*|*":"*)
              echo "build-output-directory must be a safe relative path" >&2
              exit 1
              ;;
          esac
          git ls-files --error-unmatch -- "$BUILD_OUTPUT_DIRECTORY" >/dev/null || {
            echo "build-output-directory '$BUILD_OUTPUT_DIRECTORY' has no tracked files" >&2
            exit 1
          }
          git rm -r -f -- "$BUILD_OUTPUT_DIRECTORY"

      - name: Build
        env:
          BUILD_SCRIPT: ${{ inputs.build-script }}
        run: pnpm run "$BUILD_SCRIPT"

      - name: Verify committed build output
        if: ${{ inputs.verify-build-clean }}
        env:
          BUILD_OUTPUT_DIRECTORY: ${{ inputs.build-output-directory }}
        run: |
          if [ -z "$BUILD_OUTPUT_DIRECTORY" ]; then
            echo "verify-build-clean requires build-output-directory" >&2
            exit 1
          fi
          git add --all -- "$BUILD_OUTPUT_DIRECTORY"
          git diff --cached --exit-code -- "$BUILD_OUTPUT_DIRECTORY"
