name: Node CI

# Reusable workflow. Projects delegate to this rather than copying CI logic:
#
#   jobs:
#     ci:
#       uses: cpheinrich/morpheus/.github/workflows/node-ci.yml@main
#
# Improving CI for every project is then one commit here.

on:
  workflow_call:
    inputs:
      run-check:
        description: Skip the inner job while retaining its reported check name.
        type: boolean
        default: true
      node-version:
        type: string
        default: "22"
      pnpm-version:
        description: >
          Leave empty to let package.json's `packageManager` field decide, which
          is the modern default. Setting both makes pnpm/action-setup fail with
          "Multiple versions of pnpm specified".
        type: string
        default: ""
      working-directory:
        type: string
        default: "."
      runner:
        description: >
          Single runner label for the job: a GitHub-hosted image
          (ubuntu-latest) or a self-hosted runner label such as linux-vm.
          One label, not JSON; the caller owns any fallback.
        type: string
        default: "ubuntu-latest"
      run-lint:
        type: boolean
        default: false
      run-workflow-lint:
        description: Validate all repository workflows with pinned actionlint (Linux X64).
        type: boolean
        default: false
      build-script:
        description: Package script that produces the deployable output.
        type: string
        default: "build"
      verify-build-clean:
        description: >
          Fail when the build changes committed output inside build-output-directory.
          Requires build-output-directory.
        type: boolean
        default: false
      build-output-directory:
        description: >
          Safe relative path to the tracked generated directory cleaned and checked by a
          verified build.
        type: string
        default: ""
      parallel-static-checks:
        description: >
          Run typecheck, lint and the build concurrently in the same job before the
          tests, instead of one after another around them. The build then precedes
          the tests, so a failed build stops the job before they run.
        type: boolean
        default: false

jobs:
  check:
    if: ${{ inputs.run-check }}
    runs-on: ${{ inputs.runner }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ inputs.pnpm-version }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm
          cache-dependency-path: ${{ inputs.working-directory }}/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Validate GitHub Actions workflows
        if: ${{ inputs.run-workflow-lint }}
        working-directory: .
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$RUNNER_OS/$RUNNER_ARCH" = Linux/X64
          tool_dir="$(mktemp -d "$RUNNER_TEMP/actionlint.XXXXXX")"
          if ! curl --fail --silent --show-error --location --connect-timeout 15 --max-time 90 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$tool_dir/actionlint.tar.gz"; then
            gh release download v1.7.12 --repo github.com/rhysd/actionlint --pattern actionlint_1.7.12_linux_amd64.tar.gz \
              --output "$tool_dir/actionlint.tar.gz" --clobber
          fi
          printf '%s  %s\n' 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 "$tool_dir/actionlint.tar.gz" \
            | sha256sum --check --status
          tar -xzf "$tool_dir/actionlint.tar.gz" -C "$tool_dir" actionlint
          rm "$tool_dir/actionlint.tar.gz"
          "$tool_dir/actionlint" -version
          "$tool_dir/actionlint" -shellcheck= -pyflakes=
          echo "$tool_dir" >> "$GITHUB_PATH"

      - name: Typecheck
        if: ${{ !inputs.parallel-static-checks }}
        run: &typecheck pnpm typecheck

      - name: Lint
        if: ${{ !inputs.parallel-static-checks && inputs.run-lint }}
        run: &lint pnpm lint

      - name: Install Morpheus context search runtime
        if: ${{ !inputs.parallel-static-checks && github.repository == 'cpheinrich/morpheus' && runner.os == 'Linux' }}
        run: &context_runtime |
          sudo apt-get update -q
          sudo apt-get install -y ripgrep
          pnpm morpheus context runtime install

      # Opt-in. These checks do not depend on one another, and the tests already
      # saturate the runner, so they share its cores here instead of queueing
      # around the tests. Each script is the serial step's own, through a YAML
      # alias, under the serial step's condition. The build moves ahead of the
      # tests: they then read the rebuilt output, which the verification proves
      # identical to the committed one whenever this step passes.
      - name: Typecheck, lint and build concurrently
        if: ${{ inputs.parallel-static-checks }}
        env:
          RUN_LINT: ${{ inputs.run-lint }}
          RUN_CONTEXT_RUNTIME: ${{ github.repository == 'cpheinrich/morpheus' && runner.os == 'Linux' }}
          VERIFY_BUILD_CLEAN: ${{ inputs.verify-build-clean }}
          BUILD_SCRIPT: ${{ inputs.build-script }}
          BUILD_OUTPUT_DIRECTORY: ${{ inputs.build-output-directory }}
          TYPECHECK_STEP: *typecheck
          LINT_STEP: *lint
          CONTEXT_RUNTIME_STEP: *context_runtime
          CLEAN_BUILD_STEP: &clean_build |
            case "$BUILD_OUTPUT_DIRECTORY" in
              "."|"/"|/*|*".."*|*"*"*|*"?"*|*"["*|*":"*)
                echo "build-output-directory must be a safe relative path" >&2
                exit 1
                ;;
            esac
            git ls-files --error-unmatch -- "$BUILD_OUTPUT_DIRECTORY" >/dev/null || {
              echo "build-output-directory '$BUILD_OUTPUT_DIRECTORY' has no tracked files" >&2
              exit 1
            }
            git rm -r -f -- "$BUILD_OUTPUT_DIRECTORY"
          BUILD_STEP: &build pnpm run "$BUILD_SCRIPT"
          VERIFY_BUILD_STEP: &verify_build |
            if [ -z "$BUILD_OUTPUT_DIRECTORY" ]; then
              echo "verify-build-clean requires build-output-directory" >&2
              exit 1
            fi
            git add --all -- "$BUILD_OUTPUT_DIRECTORY"
            git diff --cached --exit-code -- "$BUILD_OUTPUT_DIRECTORY"
        run: |
          set -uo pipefail
          step() { bash -e -c "$1"; }
          build() {
            if [ "$VERIFY_BUILD_CLEAN" = true ] && [ -n "$BUILD_OUTPUT_DIRECTORY" ]; then
              step "$CLEAN_BUILD_STEP" || return
            fi
            step "$BUILD_STEP" || return
            if [ "$VERIFY_BUILD_CLEAN" = true ]; then step "$VERIFY_BUILD_STEP" || return; fi
          }
          logs="$(mktemp -d "$RUNNER_TEMP/static-checks.XXXXXX")"
          names=()
          pids=()
          start() {
            names+=("$1")
            ( status=0; "${@:2}" > "$logs/$1.log" 2>&1 || status=$?; echo "$SECONDS" > "$logs/$1.seconds"; exit "$status" ) &
            pids+=("$!")
          }
          start typecheck step "$TYPECHECK_STEP"
          if [ "$RUN_LINT" = true ]; then start lint step "$LINT_STEP"; fi
          if [ "$RUN_CONTEXT_RUNTIME" = true ]; then start context-runtime step "$CONTEXT_RUNTIME_STEP"; fi
          start build build
          failed=()
          for i in "${!names[@]}"; do
            if wait "${pids[$i]}"; then
              echo "::group::${names[$i]} passed in $(cat "$logs/${names[$i]}.seconds")s"
              cat "$logs/${names[$i]}.log"
              echo "::endgroup::"
            else
              failed+=("${names[$i]}")
            fi
          done
          # Failures print last and unfolded: `morpheus wait-ci` reports this step's tail.
          for name in ${failed[@]+"${failed[@]}"}; do
            echo "::error title=${name} failed::${name} failed after $(cat "$logs/$name.seconds")s; its output follows."
            cat "$logs/$name.log"
          done
          [ "${#failed[@]}" -eq 0 ]

      - name: Test
        run: pnpm test

      - name: Clean committed build output
        if: ${{ !inputs.parallel-static-checks && inputs.verify-build-clean && inputs.build-output-directory != '' }}
        env:
          BUILD_OUTPUT_DIRECTORY: ${{ inputs.build-output-directory }}
        run: *clean_build

      - name: Build
        if: ${{ !inputs.parallel-static-checks }}
        env:
          BUILD_SCRIPT: ${{ inputs.build-script }}
        run: *build

      - name: Verify committed build output
        if: ${{ !inputs.parallel-static-checks && inputs.verify-build-clean }}
        env:
          BUILD_OUTPUT_DIRECTORY: ${{ inputs.build-output-directory }}
        run: *verify_build
