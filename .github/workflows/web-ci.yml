name: Web CI

# Reusable workflow for a Next.js surface in apps/web.
#
#   jobs:
#     web:
#       uses: cpheinrich/morpheus/.github/workflows/web-ci.yml@main
#       with:
#         working-directory: apps/web

on:
  workflow_call:
    inputs:
      working-directory:
        type: string
        default: "apps/web"
      node-version:
        type: string
        default: "22"
      pnpm-version:
        description: >
          Leave empty to let package.json's `packageManager` field decide, which
          is the modern default. Setting both makes pnpm/action-setup fail with
          "Multiple versions of pnpm specified".
        type: string
        default: ""
      run-e2e:
        type: boolean
        default: false
      build-tokens:
        description: Run the design-token build before the app build.
        type: boolean
        default: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ inputs.pnpm-version }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Tokens are generated from hq/brand into packages/shared, so the app
      # cannot typecheck until they exist.
      - name: Build design tokens
        if: ${{ inputs.build-tokens }}
        run: pnpm run build:tokens

      # --if-present so a surface that has not added a script yet is skipped
      # rather than failing. Discovered retrofitting Evo, which had neither
      # typecheck nor test defined.
      - name: Typecheck
        working-directory: ${{ inputs.working-directory }}
        run: pnpm run --if-present typecheck

      - name: Lint
        working-directory: ${{ inputs.working-directory }}
        run: pnpm run --if-present lint

      - name: Unit tests
        working-directory: ${{ inputs.working-directory }}
        run: pnpm run --if-present test

      - name: Build
        working-directory: ${{ inputs.working-directory }}
        run: pnpm build

      - name: E2E
        if: ${{ inputs.run-e2e }}
        run: pnpm exec playwright install --with-deps chromium && pnpm exec playwright test
