name: Paperclip HQ transport
on:
  pull_request:
    paths:
      - 'scripts/paperclip-hq/**'
      - 'tests/paperclip-hq*.test.ts'
      - 'plugins/codex-claude/src/pool*.mjs'
      - 'plugins/codex-claude/src/service.mjs'
      - 'plugins/codex-claude/tests/pool-fixtures.mjs'
      - 'plugins/codex-claude/package.json'
      - 'plugins/codex-claude/pnpm-lock.yaml'
      - '.github/workflows/paperclip-hq.yml'
      - 'pnpm-lock.yaml'
  push:
    branches: [main]
    paths:
      - 'scripts/paperclip-hq/**'
      - 'tests/paperclip-hq*.test.ts'
      - 'plugins/codex-claude/src/pool*.mjs'
      - 'plugins/codex-claude/src/service.mjs'
      - 'plugins/codex-claude/tests/pool-fixtures.mjs'
      - 'plugins/codex-claude/package.json'
      - 'plugins/codex-claude/pnpm-lock.yaml'
      - '.github/workflows/paperclip-hq.yml'
      - 'pnpm-lock.yaml'
permissions:
  contents: read
jobs:
  emulators:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir scripts/paperclip-hq install --ignore-workspace --frozen-lockfile --ignore-scripts
      - run: pnpm --dir scripts/paperclip-hq run build
      - run: pnpm --dir plugins/codex-claude install --ignore-workspace --frozen-lockfile --ignore-scripts
      - run: node --test scripts/paperclip-hq/run-qualification.test.mjs
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --global firebase-tools@15.30.1
      - name: Verify demo-only Auth, Functions and Firestore transport
        run: node scripts/paperclip-hq/run-emulators.mjs
      - name: Qualify real HQ facade with provider-free upstream fixtures
        run: node scripts/paperclip-hq/run-qualification.mjs --fixture
