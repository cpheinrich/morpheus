name: PR check

# Reusable workflow enforcing the PR conventions in AGENTS.md.
# Instructions get ignored eventually; a failing check does not.
#
#   jobs:
#     pr:
#       permissions:
#         contents: read
#         pull-requests: read
#       uses: cpheinrich/morpheus/.github/workflows/pr-check.yml@main
#
# The caller must grant `pull-requests: read`. The check reads the live pull
# request through the job token, and a repository whose default token is
# contents/packages read only (GitHub's "read" setting) answers that read with
# 403. A called workflow can only narrow what its caller grants, so declaring
# the permission below documents the need and makes a caller that omits it
# fail at validation instead of at runtime.
#
# To show an unreviewed draft as waiting rather than failed, the caller puts
# PR_CHECK_CALLER_IF (src/init/templates.ts) on its `pr` job and triggers on
# `ready_for_review` and `labeled`. The skip must be the caller's: a skipped
# caller job leaves `pr / conventions` unreported, which blocks merge, while a
# skip or pass in here would satisfy branch protection. This workflow itself
# never passes a PR without the label. A caller without the condition keeps
# the old behaviour, a red check on an unreviewed draft.

on:
  workflow_call:
    inputs:
      product-dir:
        type: string
        default: "hq/product"
      morpheus-ref:
        type: string
        default: "main"
      node-version:
        type: string
        default: "22"
      pnpm-version:
        description: >
          Leave empty to let Morpheus's own `packageManager` field decide.
          Setting both makes pnpm/action-setup fail with "Multiple versions of
          pnpm specified".
        type: string
        default: ""
      security-import-verified:
        description: Exact-head Security and Manager App proof from Morpheus's separate read-only CI job.
        type: boolean
        default: false

# A run whose pull request has moved to a newer head checks nothing and
# passes, under the name `pr / superseded`. It used to fail with no message,
# and people chased those red runs on commits nobody could merge.
#
# The pass must never be reported as `pr / conventions`. GitHub attaches a
# pull_request run's checks to the SHA its event named, so a pass here never
# lands on the newer head. But the PR can be force-pushed back to this exact
# SHA later, and then a `pr / conventions` pass left here would be a green
# required check on the head that nothing checked. That stays true until a new
# run reports, and indefinitely if none is triggered (a push made with
# GITHUB_TOKEN, a fork run awaiting approval). A job's name is fixed before
# its steps run, so `head` decides first and `conventions` takes its name from
# that decision.
jobs:
  head:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # No concurrency, for the reason given on `conventions`: a cancelled head
    # check makes the required job report red.
    permissions:
      contents: read
      pull-requests: read
    if: github.event_name == 'pull_request'
    outputs:
      superseded-by: ${{ steps.compare.outputs.superseded-by }}
    steps:
      - name: Compare the event's head with the live pull request
        id: compare
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          EVENT_UPDATED_AT: ${{ github.event.pull_request.updated_at }}
        run: |
          set -euo pipefail
          gh api "repos/$REPOSITORY/pulls/$PR_NUMBER" > "$RUNNER_TEMP/live-pr.json"
          # >>> superseded
          # Superseded means the PR moved after this event. A read that lags
          # the event can show the previous head while EXPECTED_HEAD is still
          # current, and passing that would pass the current head unchecked.
          # So supersession needs GitHub's copy to be strictly newer than the
          # event's. An older or equal copy, or a value that is not a SHA or a
          # timestamp, fails with its reason, and `conventions` then fails too.
          LIVE_HEAD="$(jq -r '.head.sha // ""' "$RUNNER_TEMP/live-pr.json")"
          if [ "$LIVE_HEAD" != "$EXPECTED_HEAD" ]; then
            LIVE_UPDATED_AT="$(jq -r '.updated_at // ""' "$RUNNER_TEMP/live-pr.json")"
            sha='^[0-9a-f]{40}$'
            stamp='^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$'
            if [[ "$LIVE_HEAD" =~ $sha && "$EXPECTED_HEAD" =~ $sha \
              && "$LIVE_UPDATED_AT" =~ $stamp && "$EVENT_UPDATED_AT" =~ $stamp ]] \
              && (( 10#${LIVE_UPDATED_AT//[^0-9]/} > 10#${EVENT_UPDATED_AT//[^0-9]/} )); then
              echo "#$PR_NUMBER moved from $EXPECTED_HEAD to $LIVE_HEAD (updated $LIVE_UPDATED_AT, after this event's $EVENT_UPDATED_AT)."
              echo "superseded-by=$LIVE_HEAD" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::Pull request #$PR_NUMBER reads head '$LIVE_HEAD' (updated '$LIVE_UPDATED_AT'), but this run is for $EXPECTED_HEAD (event updated '$EVENT_UPDATED_AT'). That copy is not newer than the event, so $EXPECTED_HEAD may still be the head; refusing to pass it unchecked. Re-run all jobs."
            exit 1
          fi
          echo "$EXPECTED_HEAD is the head of #$PR_NUMBER."
          # <<< superseded

  conventions:
    needs: head
    # The required check is `pr / conventions`. It is reported under that name
    # unless `head` proved this run superseded.
    name: ${{ needs.head.outputs.superseded-by != '' && 'superseded' || 'conventions' }}
    runs-on: ubuntu-latest
    # A hung step otherwise runs to GitHub's six-hour default on billed
    # minutes. This ceiling sits far above the honest runtime, so it only ever
    # fires on a hang — which it then reports quickly and legibly.
    timeout-minutes: 10
    # Every required check must finish. GitHub treats a cancelled metadata run
    # as failing branch protection even when another run on this head succeeds.
    # A concurrency group also replaces pending runs when cancel-in-progress
    # is false, so do not group this job or either of its callers.
    permissions:
      contents: read
      pull-requests: read
    # Only meaningful on a pull request — there is no PR body on a push.
    # `always()` because a skip would report `pr / conventions` as skipped,
    # which satisfies protection. When `head` failed or was cancelled, this
    # job runs anyway and fails.
    if: ${{ always() && github.event_name == 'pull_request' }}
    steps:
      - name: Require the head check
        if: needs.head.result != 'success'
        env:
          HEAD_RESULT: ${{ needs.head.result }}
        run: |
          echo "::error::The head check ended '$HEAD_RESULT', so whether this run is current is unknown; refusing to pass it unchecked."
          exit 1

      - name: Report the run as superseded
        if: needs.head.outputs.superseded-by != ''
        env:
          SUPERSEDED_BY: ${{ needs.head.outputs.superseded-by }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          echo "::notice::superseded by $SUPERSEDED_BY; this run's result is moot"
          echo "Superseded: #$PR_NUMBER moved from $EXPECTED_HEAD to $SUPERSEDED_BY after this run's event. Nothing was checked; the run on $SUPERSEDED_BY is the one that counts." >> "$GITHUB_STEP_SUMMARY"

      # Before the slow setup, so the head can move between `head`'s decision
      # and this read only during the gap between the two jobs.
      - name: Read the live pull request
        if: needs.head.outputs.superseded-by == ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Reruns must read current labels/body, not the original event snapshot.
          gh api "repos/$REPOSITORY/pulls/$PR_NUMBER" > "$RUNNER_TEMP/live-pr.json"
          # The checks below judge EXPECTED_HEAD's tree by these labels and this
          # body, so they must belong to the same head. This job is already
          # named `conventions`, so a move this late cannot pass; it fails, and
          # says so.
          LIVE_HEAD="$(jq -r '.head.sha // ""' "$RUNNER_TEMP/live-pr.json")"
          if [ "$LIVE_HEAD" != "$EXPECTED_HEAD" ]; then
            echo "::error::Pull request #$PR_NUMBER moved to '$LIVE_HEAD' after this run's head check found $EXPECTED_HEAD current. This job already reports as the required conventions check, so it cannot pass unchecked; its result is moot, and the run on the new head is the one that counts."
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: needs.head.outputs.superseded-by == ''
        with:
          # checkPr diffs against the base ref, so it needs the history.
          fetch-depth: 0

      # Build the CLI from a checkout rather than installing it in the consuming
      # repo. Running `pnpm install` here would require the consumer to be a pnpm
      # Node project, and PR conventions have nothing to do with what language a
      # project is written in — the earlier version silently excluded every
      # static site and Python repo we own.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: needs.head.outputs.superseded-by == ''
        with:
          repository: cpheinrich/morpheus
          ref: ${{ inputs.morpheus-ref }}
          path: .morpheus

      # Read the version from Morpheus's own manifest, not the consuming
      # repo's. `pnpm/action-setup` looks at the repository root by default,
      # and the consumer may have no package.json at all — two of ours do not.
      # This failed everywhere except Morpheus itself, which is the only place
      # the workflow was ever exercised before today.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        if: needs.head.outputs.superseded-by == ''
        with:
          version: ${{ inputs.pnpm-version }}
          package_json_file: .morpheus/package.json

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: needs.head.outputs.superseded-by == ''
        with:
          node-version: ${{ inputs.node-version }}

      - name: Install the Morpheus CLI runtime
        if: needs.head.outputs.superseded-by == ''
        working-directory: .morpheus
        # Old pinned refs still build through their prepare hook; new refs
        # already carry dist/. Either way the workflow body stays compatible
        # with the exact Morpheus ref the consumer selected.
        run: pnpm install --frozen-lockfile

      - name: Check PR conventions
        if: needs.head.outputs.superseded-by == ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          PRODUCT_DIR: ${{ inputs.product-dir }}
          BASE_REF: ${{ github.base_ref }}
          MORPHEUS_SECURITY_IMPORT_VERIFIED: ${{ inputs.security-import-verified }}
        run: |
          set -euo pipefail
          # The live pull request was read, and its head matched, before setup.
          # >>> pr-head
          # Every check below must read the PR head: the review gate reads
          # morpheus.json and the record there, the rest diff and read its tree.
          # Normally the checkout is refs/pull/N/merge, whose second parent is
          # the head. Some runs get a checkout of the base branch instead, or a
          # merge ref GitHub has not recomputed for the newest push, and then
          # the head may be absent — which `git show <sha>:morpheus.json`
          # reports as "exists on disk, but not in <sha>". Fetch it by its pull
          # ref (that also covers a fork, whose branch is not among origin's
          # heads) and check it out, rather than judge some other tree.
          # A failed fetch is not fatal here: `check pr` then names the missing
          # commit, which says more than a raw fetch error would.
          if ! git cat-file -e "$EXPECTED_HEAD^{commit}" 2> /dev/null; then
            git fetch --no-tags origin "+refs/pull/$PR_NUMBER/head:refs/remotes/pull/$PR_NUMBER/head" \
              || echo "::warning::Could not fetch refs/pull/$PR_NUMBER/head."
          fi
          if git cat-file -e "$EXPECTED_HEAD^{commit}" 2> /dev/null \
            && [ "$(git rev-parse HEAD)" != "$EXPECTED_HEAD" ] \
            && [ "$(git rev-parse --verify --quiet 'HEAD^2' || true)" != "$EXPECTED_HEAD" ]; then
            echo "::notice::The checkout is not this pull request's merge commit; checking the PR head out directly."
            git checkout --quiet --detach "$EXPECTED_HEAD"
          fi
          # <<< pr-head
          # Who applied the GitHub Manager's label is not in the pull request
          # payload. The newest `labeled` event for it is; an author applying the
          # label to their own record is refused on that evidence. A failed read
          # leaves the actor empty, which the check also refuses.
          MANAGER_LABEL_ACTOR="$(gh api --paginate "repos/$REPOSITORY/issues/$PR_NUMBER/events?per_page=100" \
            --jq '.[] | select(.event == "labeled" and .label.name == "manager-reviewed") | .actor.login' | tail -n 1 || true)"
          # The label says who; the App's own comment says which commit. Its
          # newest comment carrying a cleared head is the only clearance the
          # check accepts, so a push after it cannot ride on the label.
          gh api --paginate --slurp "repos/$REPOSITORY/issues/$PR_NUMBER/comments?per_page=100" \
            > "$RUNNER_TEMP/comments.json" 2> /dev/null || echo '[]' > "$RUNNER_TEMP/comments.json"
          jq -r '[.[][] | select(.user.login == "morpheus-gh-manager[bot]") | .body // ""
                  | select(test("<!-- morpheus-gh-manager \\{[^\n]*\"cleared\""))] | last // ""' \
            "$RUNNER_TEMP/comments.json" > "$RUNNER_TEMP/manager-clearance.md"
          jq --arg actor "$MANAGER_LABEL_ACTOR" --rawfile clearance "$RUNNER_TEMP/manager-clearance.md" \
            '{pull_request: (. + {
               manager_label_actor: (if $actor == "" then null else $actor end),
               manager_clearance: (if ($clearance | length) == 0 then null else $clearance end)})}' \
            "$RUNNER_TEMP/live-pr.json" > "$RUNNER_TEMP/review-event.json"
          GITHUB_EVENT_PATH="$RUNNER_TEMP/review-event.json" node .morpheus/dist/cli/index.js check pr \
            --dir "$PRODUCT_DIR" --base "origin/$BASE_REF"
