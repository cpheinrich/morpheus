name: iOS CI

# Reusable workflow for a native Xcode project. Projects keep only a thin
# trigger and delegate the macOS runner, toolchain, package lock, simulator,
# result bundles, and failure artifacts here:
#
#   jobs:
#     ios:
#       uses: cpheinrich/morpheus/.github/workflows/ios-ci.yml@main
#       with:
#         project: Evo.xcodeproj
#         scheme: Evo
#
# The defaults track Evo's current iOS 26 test surface. A different native app
# normally needs to pass only its project and scheme.

on:
  workflow_call:
    inputs:
      runner:
        description: GitHub-hosted macOS image with the requested Xcode and simulator runtime.
        type: string
        default: "macos-26"
      timeout-minutes:
        description: Maximum hosted job duration, including package resolution and artifact export.
        type: number
        default: 30
      xcode-version:
        description: Exact Xcode version installed as /Applications/Xcode_<version>.app.
        type: string
        default: "26.6"
      working-directory:
        description: Directory containing the Xcode project.
        type: string
        default: "apps/ios"
      project:
        description: Xcode project path, relative to working-directory.
        type: string
        default: "Evo.xcodeproj"
      scheme:
        description: Shared scheme whose test action owns the unit and UI test targets.
        type: string
        default: "Evo"
      configuration:
        type: string
        default: "Debug"
      sdk:
        description: SDK passed to xcodebuild.
        type: string
        default: "iphonesimulator"
      platform:
        description: Destination platform; destination supplies the remaining qualifiers.
        type: string
        default: "iOS Simulator"
      destination:
        description: Destination qualifiers appended after platform.
        type: string
        default: "OS=26.5,name=iPhone 17 Pro Max"
      test-plan:
        description: Optional shared Xcode test plan. Empty uses the scheme's default test action.
        type: string
        default: ""
      parallel-testing:
        description: Allow Xcode to run test targets in parallel. Off by default for deterministic UI tests.
        type: boolean
        default: false
      firebase-emulators:
        description: Run the test action inside Firebase Emulator Suite when the app depends on local services.
        type: boolean
        default: false
      firebase-cli-version:
        description: Exact firebase-tools version installed when Firebase emulators are enabled.
        type: string
        default: "15.28.1"
      firebase-config:
        description: Firebase config path relative to the repository root.
        type: string
        default: "firebase.json"
      firebase-project:
        description: Synthetic Firebase project id used by the emulator-backed test run.
        type: string
        default: "demo-ios-ci"
      firebase-only:
        description: Comma-separated Firebase emulators needed by the iOS tests.
        type: string
        default: "auth,firestore"
      pre-test-script:
        description: Optional repository-relative script run immediately before tests, inside emulators when enabled.
        type: string
        default: ""
      run-tests:
        description: Run every unit and UI test enabled by the shared scheme or selected test plan.
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    concurrency:
      group: ios-ci-${{ github.repository }}-${{ github.ref }}-${{ inputs.scheme }}
      cancel-in-progress: true
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # GitHub's macos-26 image carries Xcode 26.6, the iOS 26.5 SDK and the
      # iPhone 17 Pro Max simulator. Selecting DEVELOPER_DIR directly is a
      # small, auditable operation and avoids a third-party setup action in
      # every consuming repository's trusted CI path.
      - name: Select Xcode
        env:
          XCODE_VERSION: ${{ inputs.xcode-version }}
        run: |
          if [[ ! "$XCODE_VERSION" =~ ^[0-9]+(\.[0-9]+){1,2}$ ]]; then
            echo "xcode-version must be an exact numeric version such as 26.6" >&2
            exit 1
          fi

          xcode_app="/Applications/Xcode_${XCODE_VERSION}.app"
          if [ ! -d "$xcode_app" ]; then
            echo "Xcode $XCODE_VERSION is not installed on this runner. Installed versions:" >&2
            find /Applications -maxdepth 1 -type d -name 'Xcode_*.app' -print >&2
            exit 1
          fi

          echo "DEVELOPER_DIR=$xcode_app/Contents/Developer" >> "$GITHUB_ENV"
          "$xcode_app/Contents/Developer/usr/bin/xcodebuild" -version

      - name: Validate locked project inputs
        env:
          PROJECT: ${{ inputs.project }}
          SCHEME: ${{ inputs.scheme }}
          FIREBASE_EMULATORS: ${{ inputs.firebase-emulators }}
          FIREBASE_CLI_VERSION: ${{ inputs.firebase-cli-version }}
          FIREBASE_CONFIG: ${{ inputs.firebase-config }}
          FIREBASE_PROJECT: ${{ inputs.firebase-project }}
          FIREBASE_ONLY: ${{ inputs.firebase-only }}
          PRE_TEST_SCRIPT: ${{ inputs.pre-test-script }}
        run: |
          case "$PROJECT" in
            ""|/*|*".."*)
              echo "project must be a non-empty relative path without '..'" >&2
              exit 1
              ;;
          esac

          if [ ! -d "$PROJECT" ]; then
            echo "Xcode project '$PROJECT' was not found in $PWD" >&2
            exit 1
          fi
          if [ -z "$SCHEME" ]; then
            echo "scheme must not be empty" >&2
            exit 1
          fi

          lockfile=$(find . -type f -name Package.resolved -print -quit)
          if [ -z "$lockfile" ]; then
            echo "A checked-in Package.resolved is required for reproducible SwiftPM resolution" >&2
            exit 1
          fi
          git ls-files --error-unmatch -- "$lockfile" >/dev/null || {
            echo "Package.resolved must be committed: $lockfile" >&2
            exit 1
          }

          if [ -n "$PRE_TEST_SCRIPT" ]; then
            case "$PRE_TEST_SCRIPT" in
              /*|*".."*)
                echo "pre-test-script must be relative to the repository root without '..'" >&2
                exit 1
                ;;
            esac
            if [ ! -f "$GITHUB_WORKSPACE/$PRE_TEST_SCRIPT" ]; then
              echo "pre-test-script was not found: $PRE_TEST_SCRIPT" >&2
              exit 1
            fi
          fi

          if [ "$FIREBASE_EMULATORS" = "true" ]; then
            case "$FIREBASE_CONFIG" in
              ""|/*|*".."*)
                echo "firebase-config must be a non-empty repository-relative path without '..'" >&2
                exit 1
                ;;
            esac
            if [ ! -f "$GITHUB_WORKSPACE/$FIREBASE_CONFIG" ]; then
              echo "firebase-config was not found: $FIREBASE_CONFIG" >&2
              exit 1
            fi
            if [[ ! "$FIREBASE_CLI_VERSION" =~ ^[0-9]+(\.[0-9]+){2}$ ]]; then
              echo "firebase-cli-version must be an exact semantic version" >&2
              exit 1
            fi
            if [[ ! "$FIREBASE_PROJECT" =~ ^[a-z][a-z0-9-]{4,28}[a-z0-9]$ ]]; then
              echo "firebase-project must be a valid explicit project id" >&2
              exit 1
            fi
            if [[ ! "$FIREBASE_ONLY" =~ ^[a-z]+(,[a-z]+)*$ ]]; then
              echo "firebase-only must be a comma-separated emulator list" >&2
              exit 1
            fi
          fi

      - name: Prepare isolated build directories
        run: |
          ios_ci_root="$RUNNER_TEMP/ios-ci"
          mkdir -p \
            "$ios_ci_root/SourcePackages" \
            "$ios_ci_root/DerivedData" \
            "$ios_ci_root/Results" \
            "$ios_ci_root/Logs" \
            "$ios_ci_root/Screenshots"
          {
            echo "SOURCE_PACKAGES=$ios_ci_root/SourcePackages"
            echo "DERIVED_DATA=$ios_ci_root/DerivedData"
            echo "RESULTS=$ios_ci_root/Results"
            echo "LOGS=$ios_ci_root/Logs"
            echo "SCREENSHOTS=$ios_ci_root/Screenshots"
          } >> "$GITHUB_ENV"

      - name: Cache resolved Swift packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/ios-ci/SourcePackages
          key: swiftpm-${{ runner.os }}-xcode-${{ inputs.xcode-version }}-${{ hashFiles(format('{0}/**/Package.resolved', inputs.working-directory)) }}

      - name: Resolve locked Swift packages
        env:
          PROJECT: ${{ inputs.project }}
          SCHEME: ${{ inputs.scheme }}
        run: |
          set -o pipefail
          xcodebuild \
            -resolvePackageDependencies \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -clonedSourcePackagesDirPath "$SOURCE_PACKAGES" \
            -onlyUsePackageVersionsFromResolvedFile \
            2>&1 | tee "$LOGS/package-resolution.log"

      - name: Use Java 21 for Firebase emulators
        if: ${{ inputs.run-tests && inputs.firebase-emulators }}
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Install the locked Firebase emulator CLI
        if: ${{ inputs.run-tests && inputs.firebase-emulators }}
        env:
          FIREBASE_CLI_VERSION: ${{ inputs.firebase-cli-version }}
        run: npm install --global "firebase-tools@$FIREBASE_CLI_VERSION"

      - name: Build for testing
        if: ${{ inputs.run-tests }}
        env:
          PROJECT: ${{ inputs.project }}
          SCHEME: ${{ inputs.scheme }}
          CONFIGURATION: ${{ inputs.configuration }}
          SDK: ${{ inputs.sdk }}
          PLATFORM: ${{ inputs.platform }}
          DESTINATION: ${{ inputs.destination }}
          TEST_PLAN: ${{ inputs.test-plan }}
          PARALLEL_TESTING: ${{ inputs.parallel-testing && 'YES' || 'NO' }}
        run: |
          set -o pipefail
          args=(
            -project "$PROJECT"
            -scheme "$SCHEME"
            -configuration "$CONFIGURATION"
            -sdk "$SDK"
            -destination "platform=$PLATFORM,$DESTINATION"
            -clonedSourcePackagesDirPath "$SOURCE_PACKAGES"
            -derivedDataPath "$DERIVED_DATA"
            -resultBundlePath "$RESULTS/Build.xcresult"
            -onlyUsePackageVersionsFromResolvedFile
            -disableAutomaticPackageResolution
            -parallel-testing-enabled "$PARALLEL_TESTING"
          )
          if [ -n "$TEST_PLAN" ]; then
            args+=(-testPlan "$TEST_PLAN")
          fi
          xcodebuild build-for-testing "${args[@]}" 2>&1 | tee "$LOGS/build.log"

      - name: Build
        if: ${{ !inputs.run-tests }}
        env:
          PROJECT: ${{ inputs.project }}
          SCHEME: ${{ inputs.scheme }}
          CONFIGURATION: ${{ inputs.configuration }}
          SDK: ${{ inputs.sdk }}
          PLATFORM: ${{ inputs.platform }}
          DESTINATION: ${{ inputs.destination }}
        run: |
          set -o pipefail
          xcodebuild build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -sdk "$SDK" \
            -destination "platform=$PLATFORM,$DESTINATION" \
            -clonedSourcePackagesDirPath "$SOURCE_PACKAGES" \
            -derivedDataPath "$DERIVED_DATA" \
            -resultBundlePath "$RESULTS/Build.xcresult" \
            -onlyUsePackageVersionsFromResolvedFile \
            -disableAutomaticPackageResolution \
            2>&1 | tee "$LOGS/build.log"

      - name: Run unit and UI tests
        if: ${{ inputs.run-tests }}
        env:
          PROJECT: ${{ inputs.project }}
          SCHEME: ${{ inputs.scheme }}
          CONFIGURATION: ${{ inputs.configuration }}
          SDK: ${{ inputs.sdk }}
          PLATFORM: ${{ inputs.platform }}
          DESTINATION: ${{ inputs.destination }}
          TEST_PLAN: ${{ inputs.test-plan }}
          PARALLEL_TESTING: ${{ inputs.parallel-testing && 'YES' || 'NO' }}
          FIREBASE_EMULATORS: ${{ inputs.firebase-emulators }}
          FIREBASE_CONFIG: ${{ inputs.firebase-config }}
          FIREBASE_PROJECT: ${{ inputs.firebase-project }}
          FIREBASE_ONLY: ${{ inputs.firebase-only }}
          PRE_TEST_SCRIPT: ${{ inputs.pre-test-script }}
        run: |
          set -o pipefail
          args=(
            -project "$PROJECT"
            -scheme "$SCHEME"
            -configuration "$CONFIGURATION"
            -sdk "$SDK"
            -destination "platform=$PLATFORM,$DESTINATION"
            -clonedSourcePackagesDirPath "$SOURCE_PACKAGES"
            -derivedDataPath "$DERIVED_DATA"
            -resultBundlePath "$RESULTS/Tests.xcresult"
            -onlyUsePackageVersionsFromResolvedFile
            -disableAutomaticPackageResolution
            -parallel-testing-enabled "$PARALLEL_TESTING"
          )
          if [ -n "$TEST_PLAN" ]; then
            args+=(-testPlan "$TEST_PLAN")
          fi
          if [ "$FIREBASE_EMULATORS" = "true" ]; then
            printf -v test_command '%q ' xcodebuild test-without-building "${args[@]}"
            test_command+=" 2>&1"
            if [ -n "$PRE_TEST_SCRIPT" ]; then
              printf -v pre_test_command 'bash %q' "$GITHUB_WORKSPACE/$PRE_TEST_SCRIPT"
              test_command="$pre_test_command && $test_command"
            fi

            firebase emulators:exec \
              --config "$GITHUB_WORKSPACE/$FIREBASE_CONFIG" \
              --project "$FIREBASE_PROJECT" \
              --only "$FIREBASE_ONLY" \
              "$test_command" \
              2>&1 | tee "$LOGS/tests.log"
          else
            if [ -n "$PRE_TEST_SCRIPT" ]; then
              bash "$GITHUB_WORKSPACE/$PRE_TEST_SCRIPT"
            fi
            xcodebuild test-without-building "${args[@]}" 2>&1 | tee "$LOGS/tests.log"
          fi

      - name: Export rendered test attachments
        if: ${{ always() && inputs.run-tests }}
        run: |
          set -o pipefail
          result_bundle="$RESULTS/Tests.xcresult"
          if [ ! -d "$result_bundle" ]; then
            echo "No test result bundle exists; there are no rendered attachments to export."
            exit 0
          fi

          if ! xcrun xcresulttool export attachments \
            --path "$result_bundle" \
            --output-path "$SCREENSHOTS" \
            2>&1 | tee "$LOGS/attachments.log"; then
            echo "::warning title=Rendered attachments unavailable::xcresulttool could not export test attachments"
          fi

      - name: Upload rendered test attachments
        if: ${{ always() && inputs.run-tests }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ios-screenshots-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ios-ci/Screenshots
          if-no-files-found: ignore
          retention-days: 14

      - name: Collect Firebase emulator diagnostics
        if: ${{ always() && inputs.run-tests && inputs.firebase-emulators }}
        run: |
          candidate_logs=(
            "$GITHUB_WORKSPACE/firebase-debug.log"
            "$PWD/firebase-debug.log"
          )
          for candidate in "${candidate_logs[@]}"; do
            if [ -f "$candidate" ]; then
              cp "$candidate" "$LOGS/firebase-debug.log"
              exit 0
            fi
          done
          echo "Firebase did not produce a debug log."

      - name: Upload Xcode failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ios-ci-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ios-ci/Results
            ${{ runner.temp }}/ios-ci/Logs
          if-no-files-found: warn
          retention-days: 14
