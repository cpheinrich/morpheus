name: iOS CI

# Reusable workflow for a native Xcode project. Projects keep only a thin
# trigger and delegate the macOS runner, toolchain, package lock, simulator,
# result bundles, and failure artifacts here:
#
#   jobs:
#     ios:
#       uses: cpheinrich/morpheus/.github/workflows/ios-ci.yml@main
#       with:
#         project: Evo.xcodeproj
#         scheme: Evo
#
# The defaults track Evo's current iOS 26 test surface. A different native app
# normally needs to pass only its project and scheme.

on:
  workflow_call:
    inputs:
      watch-paths:
        description: Optional newline-separated Git pathspecs. Unrelated pull requests report success without native work; other events always run.
        type: string
        default: ""
      runner:
        description: GitHub-hosted image or self-hosted runner label with the requested Xcode and simulator runtime.
        type: string
        default: "macos-26"
      timeout-minutes:
        description: Maximum hosted job duration, including package resolution and artifact export.
        type: number
        default: 30
      xcode-version:
        description: Exact Xcode version installed as /Applications/Xcode_<version>.app.
        type: string
        default: "26.6"
      working-directory:
        description: Directory containing the Xcode project.
        type: string
        default: "apps/ios"
      project:
        description: Xcode project path, relative to working-directory.
        type: string
        default: "Evo.xcodeproj"
      scheme:
        description: Shared scheme whose test action owns the unit and UI test targets.
        type: string
        default: "Evo"
      configuration:
        type: string
        default: "Debug"
      sdk:
        description: SDK passed to xcodebuild.
        type: string
        default: "iphonesimulator"
      platform:
        description: Destination platform; destination supplies the remaining qualifiers.
        type: string
        default: "iOS Simulator"
      destination:
        description: Destination qualifiers appended after platform.
        type: string
        default: "OS=26.5,name=iPhone 17 Pro Max"
      test-plan:
        description: Optional shared Xcode test plan. Empty uses the scheme's default test action.
        type: string
        default: ""
      test-iterations:
        description: >
          Re-run only the tests that failed, up to this many attempts in total.
          Zero disables retries. A test that fails every attempt still fails, so
          eventual success does not establish first-attempt reliability.
          Intermittent product defects can pass on retry; preserve the evidence.
        type: number
        default: 0
      only-testing:
        description: Newline-separated xcodebuild test identifiers to include; empty preserves the complete scheme.
        type: string
        default: ""
      test-selection:
        description: Optional caller-generated JSON selection manifest, retained verbatim with result evidence.
        type: string
        default: ""
      test-evidence-script:
        description: Optional repository-relative Bash script validating exported results. Runs after tests even on failure; nonzero fails the job.
        type: string
        default: ""
      skip-testing:
        description: >
          Newline-separated xcodebuild -skip-testing identifiers
          (TestTarget[/TestClass[/testMethod]]), for excluding specific tests
          from this run — for example a caller keeping an expensive
          XCTMeasureOptions performance test out of the per-PR job while a
          separate nightly caller runs the full scheme. Empty runs everything
          the scheme or test plan already selects.
        type: string
        default: ""
      parallel-testing:
        description: Allow Xcode to run test targets in parallel. Off by default for deterministic UI tests.
        type: boolean
        default: false
      maximum-parallel-testing-workers:
        description: Maximum simulator test workers when parallel testing is enabled; zero lets Xcode decide.
        type: number
        default: 0
      firebase-emulators:
        description: Run the test action inside Firebase Emulator Suite when the app depends on local services.
        type: boolean
        default: false
      firebase-cli-version:
        description: Exact firebase-tools version installed when Firebase emulators are enabled.
        type: string
        default: "15.28.1"
      firebase-config:
        description: Firebase config path relative to the repository root.
        type: string
        default: "firebase.json"
      firebase-project:
        description: Synthetic Firebase project id used by the emulator-backed test run.
        type: string
        default: "demo-ios-ci"
      firebase-only:
        description: Comma-separated Firebase emulators needed by the iOS tests.
        type: string
        default: "auth,firestore"
      pre-test-script:
        description: Optional repository-relative script run immediately before tests, inside emulators when enabled.
        type: string
        default: ""
      run-tests:
        description: Run every unit and UI test enabled by the shared scheme or selected test plan.
        type: boolean
        default: true
      swift-format-lint:
        description: Lint Swift files changed by this commit with the selected Xcode toolchain's swift-format.
        type: boolean
        default: false
      swift-format-configuration:
        description: swift-format configuration path, relative to working-directory.
        type: string
        default: ".swift-format"
      optimize-test-build:
        description: >
          Override the caller's Debug configuration with the optimization level
          Xcode actually resolves for a configuration named Release (-O for
          Swift, -Os for C/Objective-C, whole-module compilation), CI-only.
          Local Xcode debugging is unaffected — a developer's own Debug build
          never passes this. Measured on Evo: the build itself got faster, not
          slower, and every downstream UI test ran faster too, since Debug's
          default -Onone was the thing making its own graphics-heavy screens
          slow to render under test.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    # `github.workflow` names the *caller*, which is what separates a pull
    # request's CI run from a release workflow that calls this same job on
    # refs/heads/main. Without it both land in one group and the release's
    # tests can be cancelled by an unrelated push — or cancel it.
    concurrency:
      group: ios-ci-${{ github.repository }}-${{ github.workflow }}-${{ github.ref }}-${{ inputs.scheme }}
      cancel-in-progress: true
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Scoped PRs need ancestry to verify a merge regenerated after the event.
          # Other callers only need the first parent for the style gate.
          fetch-depth: ${{ github.event_name == 'pull_request' && inputs.watch-paths != '' && '0' || '2' }}
          persist-credentials: false

      - name: Check native change scope
        id: scope
        working-directory: .
        env:
          WATCH_PATHS: ${{ inputs.watch-paths }}
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != pull_request ] || [ -z "$WATCH_PATHS" ]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # GitHub can regenerate the merge ref against newer trunk while the
          # event still names its old base. Verify ancestry, but keep the exact head.
          if ! [[ "$PR_BASE_SHA" =~ ^[a-f0-9]{40}$ && "$PR_HEAD_SHA" =~ ^[a-f0-9]{40}$ ]]; then
            echo '::error::Native scope requires valid event base and head SHAs.' >&2
            exit 1
          fi
          read -r -a parents <<< "$(git show -s --format=%P HEAD)"
          if [ "${#parents[@]}" -ne 2 ]; then
            echo '::error::Native scope requires a two-parent PR merge.' >&2
            exit 1
          fi
          merge_base="${parents[0]}"
          merge_head="${parents[1]}"
          echo "Native scope: event base=$PR_BASE_SHA head=$PR_HEAD_SHA; checkout base=$merge_base head=$merge_head"
          if [ "$merge_head" != "$PR_HEAD_SHA" ]; then
            echo '::error::PR merge head does not match event head.' >&2
            exit 1
          fi
          if ! git cat-file -e "$merge_head^{commit}" || ! git merge-base --is-ancestor "$PR_BASE_SHA" "$merge_base"; then
            echo '::error::PR merge base is not descended from event base, or comparison history is missing.' >&2
            exit 1
          fi
          test -n "${WATCH_PATHS//[[:space:]]/}"
          pathspecs=()
          while IFS= read -r pathspec; do
            [ -z "$pathspec" ] || pathspecs+=("$pathspec")
          done <<< "$WATCH_PATHS"
          test "${#pathspecs[@]}" -gt 0
          # Git owns matching, exclusions, deletes and names containing spaces.
          if git diff --quiet --no-renames HEAD^1 HEAD -- "${pathspecs[@]}"; then
            echo 'run=false' >> "$GITHUB_OUTPUT"
            echo 'No native app, dependency or test/build inputs changed; native work skipped.' >> "$GITHUB_STEP_SUMMARY"
          else
            status=$?
            test "$status" -eq 1
            echo 'run=true' >> "$GITHUB_OUTPUT"
          fi

      # A caller's Linux selection job cannot provide a runtime to this job.
      # Persistent macOS service accounts may not have Node on their PATH.
      - name: Set up test evidence runtime
        if: ${{ steps.scope.outputs.run == 'true' && inputs.test-evidence-script != '' }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false

      # GitHub's macos-26 image uses a versioned application name; a dedicated
      # Mac normally uses /Applications/Xcode.app. Accept either layout, then
      # verify the actual toolchain rather than trusting the path's spelling.
      - name: Select Xcode
        if: ${{ steps.scope.outputs.run == 'true' }}
        env:
          XCODE_VERSION: ${{ inputs.xcode-version }}
        run: |
          if [[ ! "$XCODE_VERSION" =~ ^[0-9]+(\.[0-9]+){1,2}$ ]]; then
            echo "xcode-version must be an exact numeric version such as 26.6" >&2
            exit 1
          fi

          versioned_xcode_app="/Applications/Xcode_${XCODE_VERSION}.app"
          if [ -d "$versioned_xcode_app" ]; then
            xcode_app="$versioned_xcode_app"
          elif [ -d /Applications/Xcode.app ]; then
            xcode_app=/Applications/Xcode.app
          else
            echo "Xcode $XCODE_VERSION is not installed on this runner. Installed versions:" >&2
            find /Applications -maxdepth 1 -type d -name 'Xcode*.app' -print >&2
            exit 1
          fi

          installed_version=$("$xcode_app/Contents/Developer/usr/bin/xcodebuild" -version | sed -n '1s/Xcode //p')
          if [ "$installed_version" != "$XCODE_VERSION" ]; then
            echo "Expected Xcode $XCODE_VERSION, but $xcode_app contains $installed_version" >&2
            exit 1
          fi
          echo "DEVELOPER_DIR=$xcode_app/Contents/Developer" >> "$GITHUB_ENV"
          "$xcode_app/Contents/Developer/usr/bin/xcodebuild" -version

      # The post action runs on success, test failure and cancellation. Each job
      # owns its test device and uniquely named XCTest clones, even on a shared Mac.
      # Persistent runners keep one shut-down, dedicated warmed template; tests
      # run only on job-owned clones. Ephemeral hosted runners create a clean device.
      - name: Create isolated test simulator
        if: ${{ steps.scope.outputs.run == 'true' && inputs.run-tests && inputs.platform == 'iOS Simulator' }}
        uses: cpheinrich/morpheus/.github/actions/ios-simulator@main
        with:
          destination: ${{ inputs.destination }}
          persistent: ${{ runner.environment == 'self-hosted' }}

      - name: Validate locked project inputs
        if: ${{ steps.scope.outputs.run == 'true' }}
        env:
          PROJECT: ${{ inputs.project }}
          SCHEME: ${{ inputs.scheme }}
          PARALLEL_TESTING: ${{ inputs.parallel-testing && 'YES' || 'NO' }}
          MAXIMUM_PARALLEL_TESTING_WORKERS: ${{ inputs.maximum-parallel-testing-workers }}
          FIREBASE_EMULATORS: ${{ inputs.firebase-emulators }}
          FIREBASE_CLI_VERSION: ${{ inputs.firebase-cli-version }}
          FIREBASE_CONFIG: ${{ inputs.firebase-config }}
          FIREBASE_PROJECT: ${{ inputs.firebase-project }}
          FIREBASE_ONLY: ${{ inputs.firebase-only }}
          PRE_TEST_SCRIPT: ${{ inputs.pre-test-script }}
          TEST_EVIDENCE_SCRIPT: ${{ inputs.test-evidence-script }}
          SWIFT_FORMAT_LINT: ${{ inputs.swift-format-lint }}
          SWIFT_FORMAT_CONFIGURATION: ${{ inputs.swift-format-configuration }}
        run: |
          case "$PROJECT" in
            ""|/*|*".."*)
              echo "project must be a non-empty relative path without '..'" >&2
              exit 1
              ;;
          esac

          if [ ! -d "$PROJECT" ]; then
            echo "Xcode project '$PROJECT' was not found in $PWD" >&2
            exit 1
          fi
          if [ -z "$SCHEME" ]; then
            echo "scheme must not be empty" >&2
            exit 1
          fi
          if [[ ! "$MAXIMUM_PARALLEL_TESTING_WORKERS" =~ ^[0-9]+$ ]]; then
            echo "maximum-parallel-testing-workers must be a non-negative integer" >&2
            exit 1
          fi
          if [ "$PARALLEL_TESTING" != "YES" ] && [ "$MAXIMUM_PARALLEL_TESTING_WORKERS" != "0" ]; then
            echo "maximum-parallel-testing-workers requires parallel-testing" >&2
            exit 1
          fi

          lockfile=$(find . -type f -name Package.resolved -print -quit)
          if [ -z "$lockfile" ]; then
            echo "A checked-in Package.resolved is required for reproducible SwiftPM resolution" >&2
            exit 1
          fi
          git ls-files --error-unmatch -- "$lockfile" >/dev/null || {
            echo "Package.resolved must be committed: $lockfile" >&2
            exit 1
          }

          if [ -n "$PRE_TEST_SCRIPT" ]; then
            case "$PRE_TEST_SCRIPT" in
              /*|*".."*)
                echo "pre-test-script must be relative to the repository root without '..'" >&2
                exit 1
                ;;
            esac
            if [ ! -f "$GITHUB_WORKSPACE/$PRE_TEST_SCRIPT" ]; then
              echo "pre-test-script was not found: $PRE_TEST_SCRIPT" >&2
              exit 1
            fi
          fi

          if [ -n "$TEST_EVIDENCE_SCRIPT" ]; then
            case "$TEST_EVIDENCE_SCRIPT" in
              /*|*".."*) echo "test-evidence-script must be repository-relative without '..'" >&2; exit 1 ;;
            esac
            test -f "$GITHUB_WORKSPACE/$TEST_EVIDENCE_SCRIPT" || exit 1
          fi

          if [ "$SWIFT_FORMAT_LINT" = "true" ]; then
            case "$SWIFT_FORMAT_CONFIGURATION" in
              ""|/*|*".."*)
                echo "swift-format-configuration must be a non-empty path relative to working-directory without '..'" >&2
                exit 1
                ;;
            esac
            if [ ! -f "$SWIFT_FORMAT_CONFIGURATION" ]; then
              echo "swift-format configuration was not found: $SWIFT_FORMAT_CONFIGURATION" >&2
              exit 1
            fi
          fi

          if [ "$FIREBASE_EMULATORS" = "true" ]; then
            case "$FIREBASE_CONFIG" in
              ""|/*|*".."*)
                echo "firebase-config must be a non-empty repository-relative path without '..'" >&2
                exit 1
                ;;
            esac
            if [ ! -f "$GITHUB_WORKSPACE/$FIREBASE_CONFIG" ]; then
              echo "firebase-config was not found: $FIREBASE_CONFIG" >&2
              exit 1
            fi
            if [[ ! "$FIREBASE_CLI_VERSION" =~ ^[0-9]+(\.[0-9]+){2}$ ]]; then
              echo "firebase-cli-version must be an exact semantic version" >&2
              exit 1
            fi
            if [[ ! "$FIREBASE_PROJECT" =~ ^[a-z][a-z0-9-]{4,28}[a-z0-9]$ ]]; then
              echo "firebase-project must be a valid explicit project id" >&2
              exit 1
            fi
            if [[ ! "$FIREBASE_ONLY" =~ ^[a-z]+(,[a-z]+)*$ ]]; then
              echo "firebase-only must be a comma-separated emulator list" >&2
              exit 1
            fi
          fi

      - name: Prepare isolated build directories
        if: ${{ steps.scope.outputs.run == 'true' }}
        id: ios_paths
        run: |
          set -euo pipefail
          # A runner that keeps a build cache between jobs (the Mac mini's
          # ephemeral VMs mount one per repo and slot) names it in
          # MORPHEUS_IOS_CI_CACHE; DerivedData and the package checkouts live
          # there at a path that never changes, so incremental builds survive
          # the VM. Everything else stays under the job's own temp directory.
          ios_ci_root="$RUNNER_TEMP/ios-ci"
          if [ -n "${MORPHEUS_IOS_CI_CACHE:-}" ] && [ -d "$MORPHEUS_IOS_CI_CACHE" ]; then
            cache_root="$MORPHEUS_IOS_CI_CACHE"
            echo "cached=true" >> "$GITHUB_OUTPUT"
          else
            cache_root="$ios_ci_root"
            echo "cached=false" >> "$GITHUB_OUTPUT"
          fi
          mkdir -p "$cache_root/SourcePackages" "$cache_root/DerivedData" "$ios_ci_root"
          # Cancellation can leave a child writing after the next job starts.
          # Never reuse or clear its evidence path. The random suffix also
          # separates multiple calls/jobs within the same run and attempt.
          output_root=$(mktemp -d "$ios_ci_root/run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.XXXXXX")
          mkdir -p "$output_root/Results" "$output_root/Logs" "$output_root/Screenshots"
          {
            echo "SOURCE_PACKAGES=$cache_root/SourcePackages"
            echo "DERIVED_DATA=$cache_root/DerivedData"
            echo "RESULTS=$output_root/Results"
            echo "LOGS=$output_root/Logs"
            echo "SCREENSHOTS=$output_root/Screenshots"
          } >> "$GITHUB_ENV"
          {
            echo "results=$output_root/Results"
            echo "logs=$output_root/Logs"
            echo "screenshots=$output_root/Screenshots"
            echo "evidence-name=ios-test-evidence-${output_root##*/}"
          } >> "$GITHUB_OUTPUT"

      # The selection lives in scripts/swift-changed-files.sh, reached through
      # this action, so a consumer wanting the same check locally calls the same
      # file rather than imitating the step below. The first one that imitated
      # it drifted inside a commit (darwin-health/evo#281), and
      # tests/swift-changed-files.test.ts now pins every caller to one list.
      - name: Select changed Swift sources
        id: swift-changed-files
        if: ${{ steps.scope.outputs.run == 'true' && inputs.swift-format-lint }}
        uses: cpheinrich/morpheus/.github/actions/swift-changed-files@main
        with:
          working-directory: ${{ inputs.working-directory }}

      - name: Lint changed Swift sources
        if: ${{ steps.scope.outputs.run == 'true' && inputs.swift-format-lint }}
        env:
          SWIFT_FORMAT_CONFIGURATION: ${{ inputs.swift-format-configuration }}
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
          SWIFT_CHANGED_FILES: ${{ steps.swift-changed-files.outputs.file }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"

          configuration="$GITHUB_WORKSPACE/$WORKING_DIRECTORY/$SWIFT_FORMAT_CONFIGURATION"
          xcrun swift-format --version
          xcrun swift-format dump-configuration \
            --effective \
            --configuration "$configuration" >/dev/null

          swift_files=()
          while IFS= read -r -d '' file; do
            swift_files+=("$file")
          done < "$SWIFT_CHANGED_FILES"

          if [ "${#swift_files[@]}" -eq 0 ]; then
            echo "No changed Swift sources to lint."
            exit 0
          fi

          printf 'Linting %s changed Swift source(s).\n' "${#swift_files[@]}"
          xcrun swift-format lint \
            --configuration "$configuration" \
            --parallel \
            --strict \
            "${swift_files[@]}"

      - name: Cache resolved Swift packages
        # A runner-provided cache directory already keeps the checkouts.
        if: ${{ steps.scope.outputs.run == 'true' && steps.ios_paths.outputs.cached != 'true' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/ios-ci/SourcePackages
          key: swiftpm-${{ runner.os }}-xcode-${{ inputs.xcode-version }}-${{ hashFiles(format('{0}/**/Package.resolved', inputs.working-directory)) }}
          # Without a prefix restore, bumping one dependency in Package.resolved
          # misses the cache entirely and re-clones every package from scratch.
          # A partial hit still leaves the unchanged checkouts in place, and
          # -onlyUsePackageVersionsFromResolvedFile keeps the result exact.
          restore-keys: |
            swiftpm-${{ runner.os }}-xcode-${{ inputs.xcode-version }}-

      - name: Resolve locked Swift packages
        if: ${{ steps.scope.outputs.run == 'true' }}
        env:
          PROJECT: ${{ inputs.project }}
          SCHEME: ${{ inputs.scheme }}
        run: |
          set -o pipefail
          xcodebuild \
            -resolvePackageDependencies \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -clonedSourcePackagesDirPath "$SOURCE_PACKAGES" \
            -onlyUsePackageVersionsFromResolvedFile \
            2>&1 | tee "$LOGS/package-resolution.log"

      - name: Use Java 21 for Firebase emulators
        if: ${{ steps.scope.outputs.run == 'true' && inputs.run-tests && inputs.firebase-emulators }}
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Install the locked Firebase emulator CLI
        if: ${{ steps.scope.outputs.run == 'true' && inputs.run-tests && inputs.firebase-emulators }}
        env:
          FIREBASE_CLI_VERSION: ${{ inputs.firebase-cli-version }}
        run: npm install --global "firebase-tools@$FIREBASE_CLI_VERSION"

      - name: Build for testing
        if: ${{ steps.scope.outputs.run == 'true' && inputs.run-tests }}
        env:
          PROJECT: ${{ inputs.project }}
          SCHEME: ${{ inputs.scheme }}
          CONFIGURATION: ${{ inputs.configuration }}
          SDK: ${{ inputs.sdk }}
          PLATFORM: ${{ inputs.platform }}
          DESTINATION: ${{ inputs.destination }}
          TEST_PLAN: ${{ inputs.test-plan }}
          PARALLEL_TESTING: ${{ inputs.parallel-testing && 'YES' || 'NO' }}
          MAXIMUM_PARALLEL_TESTING_WORKERS: ${{ inputs.maximum-parallel-testing-workers }}
          OPTIMIZE_TEST_BUILD: ${{ inputs.optimize-test-build }}
        run: |
          set -o pipefail
          args=(
            -project "$PROJECT"
            -scheme "$SCHEME"
            -configuration "$CONFIGURATION"
            -sdk "$SDK"
            -destination "platform=$PLATFORM,${MORPHEUS_IOS_DESTINATION:-$DESTINATION}"
            -clonedSourcePackagesDirPath "$SOURCE_PACKAGES"
            -derivedDataPath "$DERIVED_DATA"
            -resultBundlePath "$RESULTS/Build.xcresult"
            -onlyUsePackageVersionsFromResolvedFile
            -disableAutomaticPackageResolution
            -parallel-testing-enabled "$PARALLEL_TESTING"
            # Index-while-building exists to serve Xcode's editor. A CI runner
            # has no editor and discards the store with the machine, so this is
            # compiler work nothing ever reads.
            COMPILER_INDEX_STORE_ENABLE=NO
          )
          if [ -n "$TEST_PLAN" ]; then
            args+=(-testPlan "$TEST_PLAN")
          fi
          if [ "$MAXIMUM_PARALLEL_TESTING_WORKERS" != "0" ]; then
            args+=(-maximum-parallel-testing-workers "$MAXIMUM_PARALLEL_TESTING_WORKERS")
          fi
          if [ "$OPTIMIZE_TEST_BUILD" = "true" ]; then
            # A command-line override beats whatever CONFIGURATION resolves to
            # in the project file, and only reaches this invocation — a
            # developer's own Debug build in Xcode never passes these.
            args+=(SWIFT_OPTIMIZATION_LEVEL=-O SWIFT_COMPILATION_MODE=wholemodule GCC_OPTIMIZATION_LEVEL=s)
          fi
          xcodebuild build-for-testing "${args[@]}" 2>&1 | tee "$LOGS/build.log"

      - name: Build
        if: ${{ steps.scope.outputs.run == 'true' && !inputs.run-tests }}
        env:
          PROJECT: ${{ inputs.project }}
          SCHEME: ${{ inputs.scheme }}
          CONFIGURATION: ${{ inputs.configuration }}
          SDK: ${{ inputs.sdk }}
          PLATFORM: ${{ inputs.platform }}
          DESTINATION: ${{ inputs.destination }}
          OPTIMIZE_TEST_BUILD: ${{ inputs.optimize-test-build }}
        run: |
          set -o pipefail
          args=(
            -project "$PROJECT"
            -scheme "$SCHEME"
            -configuration "$CONFIGURATION"
            -sdk "$SDK"
            -destination "platform=$PLATFORM,${MORPHEUS_IOS_DESTINATION:-$DESTINATION}"
            -clonedSourcePackagesDirPath "$SOURCE_PACKAGES"
            -derivedDataPath "$DERIVED_DATA"
            -resultBundlePath "$RESULTS/Build.xcresult"
            -onlyUsePackageVersionsFromResolvedFile
            -disableAutomaticPackageResolution
            COMPILER_INDEX_STORE_ENABLE=NO
          )
          if [ "$OPTIMIZE_TEST_BUILD" = "true" ]; then
            args+=(SWIFT_OPTIMIZATION_LEVEL=-O SWIFT_COMPILATION_MODE=wholemodule GCC_OPTIMIZATION_LEVEL=s)
          fi
          xcodebuild build "${args[@]}" 2>&1 | tee "$LOGS/build.log"

      - name: Run unit and UI tests
        if: ${{ steps.scope.outputs.run == 'true' && inputs.run-tests }}
        env:
          PROJECT: ${{ inputs.project }}
          SCHEME: ${{ inputs.scheme }}
          CONFIGURATION: ${{ inputs.configuration }}
          SDK: ${{ inputs.sdk }}
          PLATFORM: ${{ inputs.platform }}
          DESTINATION: ${{ inputs.destination }}
          TEST_PLAN: ${{ inputs.test-plan }}
          ONLY_TESTING: ${{ inputs.only-testing }}
          SKIP_TESTING: ${{ inputs.skip-testing }}
          TEST_ITERATIONS: ${{ inputs.test-iterations }}
          PARALLEL_TESTING: ${{ inputs.parallel-testing && 'YES' || 'NO' }}
          MAXIMUM_PARALLEL_TESTING_WORKERS: ${{ inputs.maximum-parallel-testing-workers }}
          FIREBASE_EMULATORS: ${{ inputs.firebase-emulators }}
          FIREBASE_CONFIG: ${{ inputs.firebase-config }}
          FIREBASE_PROJECT: ${{ inputs.firebase-project }}
          FIREBASE_ONLY: ${{ inputs.firebase-only }}
          PRE_TEST_SCRIPT: ${{ inputs.pre-test-script }}
        run: |
          set -o pipefail
          args=(
            -project "$PROJECT"
            -scheme "$SCHEME"
            -configuration "$CONFIGURATION"
            -sdk "$SDK"
            -destination "platform=$PLATFORM,${MORPHEUS_IOS_DESTINATION:-$DESTINATION}"
            -clonedSourcePackagesDirPath "$SOURCE_PACKAGES"
            -derivedDataPath "$DERIVED_DATA"
            -resultBundlePath "$RESULTS/Tests.xcresult"
            -onlyUsePackageVersionsFromResolvedFile
            -disableAutomaticPackageResolution
            -parallel-testing-enabled "$PARALLEL_TESTING"
          )
          if [ -n "$TEST_PLAN" ]; then
            args+=(-testPlan "$TEST_PLAN")
          fi
          if [ -n "$ONLY_TESTING" ]; then
            while IFS= read -r identifier; do
              [ -z "$identifier" ] && continue
              args+=(-only-testing:"$identifier")
            done <<< "$ONLY_TESTING"
          fi
          if [ -n "$SKIP_TESTING" ]; then
            while IFS= read -r identifier; do
              [ -z "$identifier" ] && continue
              args+=(-skip-testing:"$identifier")
            done <<< "$SKIP_TESTING"
          fi
          if [ "$MAXIMUM_PARALLEL_TESTING_WORKERS" != "0" ]; then
            args+=(-maximum-parallel-testing-workers "$MAXIMUM_PARALLEL_TESTING_WORKERS")
          fi
          # `-retry-tests-on-failure` re-runs only the tests that failed, so a
          # flake costs seconds instead of the whole job. It does not weaken the
          # gate: a test that fails every attempt still fails the run.
          #
          # Each retry relaunches the test host. Without that, every attempt
          # shares one process, and a daemon the process talks to (the
          # simulator's StoreKit ledger, for one) that has stopped answering
          # fails all of them within milliseconds of each other: three
          # executions, one data point. A relaunch gives the retry the fresh
          # process a flake needs and costs a few seconds of app launch.
          if [ "${TEST_ITERATIONS:-0}" != "0" ]; then
            args+=(-retry-tests-on-failure -test-iterations "$TEST_ITERATIONS"
              -test-repetition-relaunch-enabled YES)
          fi
          if [ "$FIREBASE_EMULATORS" = "true" ]; then
            printf -v test_command '%q ' xcodebuild test-without-building "${args[@]}"
            test_command+=" 2>&1"
            if [ -n "$PRE_TEST_SCRIPT" ]; then
              printf -v pre_test_command 'bash %q' "$GITHUB_WORKSPACE/$PRE_TEST_SCRIPT"
              test_command="$pre_test_command && $test_command"
            fi

            firebase emulators:exec \
              --config "$GITHUB_WORKSPACE/$FIREBASE_CONFIG" \
              --project "$FIREBASE_PROJECT" \
              --only "$FIREBASE_ONLY" \
              "$test_command" \
              2>&1 | tee "$LOGS/tests.log"
          else
            if [ -n "$PRE_TEST_SCRIPT" ]; then
              bash "$GITHUB_WORKSPACE/$PRE_TEST_SCRIPT"
            fi
            xcodebuild test-without-building "${args[@]}" 2>&1 | tee "$LOGS/tests.log"
          fi

      - name: Export complete test evidence
        if: ${{ steps.scope.outputs.run == 'true' && always() && inputs.run-tests && steps.ios_paths.outcome == 'success' }}
        env:
          TEST_SELECTION: ${{ inputs.test-selection }}
          ONLY_TESTING: ${{ inputs.only-testing }}
          TEST_EVIDENCE_SCRIPT: ${{ inputs.test-evidence-script }}
        run: |
          set -euo pipefail
          git rev-parse HEAD > "$RESULTS/tested-sha.txt"
          printf '%s\n' "$TEST_SELECTION" > "$RESULTS/selection.json"
          printf '%s\n' "$ONLY_TESTING" > "$RESULTS/only-testing.txt"
          result_bundle="$RESULTS/Tests.xcresult"
          if [ -d "$result_bundle" ]; then
            xcrun xcresulttool get test-results tests --path "$result_bundle" > "$RESULTS/tests.json"
            xcrun xcresulttool get test-results summary --path "$result_bundle" > "$RESULTS/summary.json"
          fi
          if [ -n "$TEST_EVIDENCE_SCRIPT" ]; then
            bash "$GITHUB_WORKSPACE/$TEST_EVIDENCE_SCRIPT"
          fi

      - name: Export rendered test attachments
        if: ${{ steps.scope.outputs.run == 'true' && always() && inputs.run-tests && steps.ios_paths.outcome == 'success' }}
        run: |
          set -o pipefail
          result_bundle="$RESULTS/Tests.xcresult"
          if [ ! -d "$result_bundle" ]; then
            echo "No test result bundle exists; there are no rendered attachments to export."
            exit 0
          fi

          if ! xcrun xcresulttool export attachments \
            --path "$result_bundle" \
            --output-path "$SCREENSHOTS" \
            2>&1 | tee "$LOGS/attachments.log"; then
            echo "::warning title=Rendered attachments unavailable::xcresulttool could not export test attachments"
          fi

      - name: Upload rendered test attachments
        if: ${{ steps.scope.outputs.run == 'true' && always() && inputs.run-tests && steps.ios_paths.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ios-screenshots-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.ios_paths.outputs.screenshots }}
          if-no-files-found: ignore
          retention-days: 14

      - name: Collect Firebase emulator diagnostics
        if: ${{ steps.scope.outputs.run == 'true' && always() && inputs.run-tests && inputs.firebase-emulators && steps.ios_paths.outcome == 'success' }}
        run: |
          candidate_logs=(
            "$GITHUB_WORKSPACE/firebase-debug.log"
            "$PWD/firebase-debug.log"
          )
          for candidate in "${candidate_logs[@]}"; do
            if [ -f "$candidate" ]; then
              cp "$candidate" "$LOGS/firebase-debug.log"
              exit 0
            fi
          done
          echo "Firebase did not produce a debug log."

      - name: Upload complete test evidence
        if: ${{ steps.scope.outputs.run == 'true' && always() && inputs.run-tests && steps.ios_paths.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.ios_paths.outputs.evidence-name }}
          path: |
            ${{ steps.ios_paths.outputs.results }}/*.json
            ${{ steps.ios_paths.outputs.results }}/*.txt
            ${{ steps.ios_paths.outputs.logs }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload Xcode failure evidence
        if: ${{ steps.scope.outputs.run == 'true' && failure() && steps.ios_paths.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ios-ci-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.ios_paths.outputs.results }}
            ${{ steps.ios_paths.outputs.logs }}
          if-no-files-found: warn
          retention-days: 14
