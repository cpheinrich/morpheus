name: iOS CI

# Reusable workflow for a native Xcode project. Projects keep only a thin
# trigger and delegate the macOS runner, toolchain, package lock, simulator,
# result bundles, and failure artifacts here:
#
#   jobs:
#     ios:
#       uses: cpheinrich/morpheus/.github/workflows/ios-ci.yml@main
#       with:
#         project: Evo.xcodeproj
#         scheme: Evo
#
# The defaults track Evo's current iOS 26 test surface. A different native app
# normally needs to pass only its project and scheme.

on:
  workflow_call:
    inputs:
      source-sha:
        description: Optional exact 40-character source commit to test; required for CD execution.
        type: string
        default: ""
      execution-id:
        description: Durable CD dispatch effect id; isolates concurrency and disables cancellation.
        type: string
        default: ""
      actions-ref:
        description: >
          The commit, tag or branch of cpheinrich/morpheus whose composite actions this run uses
          (ios-simulator, swift-changed-files). A `uses:` line cannot take an expression and
          github.job_workflow_sha is empty inside a called workflow's steps (verified 2026-10-14),
          so a consumer that pins this workflow to a commit passes the same commit here and its
          actions stop floating on main (cpheinrich/morpheus#393). The default keeps today's
          behaviour for callers on @main.
        type: string
        required: false
        default: main
      artifact-stage-ref:
        description: Exact bounded-artifact helper revision for CD; ordinary main callers retain a main default.
        type: string
        default: main
      watch-paths:
        description: Optional newline-separated Git pathspecs. Unrelated pull requests report success without native work; other events always run.
        type: string
        default: ""
      runner:
        description: GitHub-hosted image or self-hosted runner label with the requested Xcode and simulator runtime.
        type: string
        default: "macos-26"
      runner-labels-json:
        description: Optional JSON array of distinct nonblank runner labels; all labels must match. Empty preserves runner.
        type: string
        default: ""
      timeout-minutes:
        description: Maximum hosted job duration, including package resolution and artifact export.
        type: number
        default: 30
      xcode-version:
        description: Exact Xcode version installed as /Applications/Xcode_<version>.app.
        type: string
        default: "26.6"
      working-directory:
        description: Directory containing the Xcode project.
        type: string
        default: "apps/ios"
      project:
        description: Xcode project path, relative to working-directory.
        type: string
        default: "Evo.xcodeproj"
      scheme:
        description: Shared scheme whose test action owns the unit and UI test targets.
        type: string
        default: "Evo"
      configuration:
        type: string
        default: "Debug"
      sdk:
        description: SDK passed to xcodebuild.
        type: string
        default: "iphonesimulator"
      platform:
        description: Destination platform; destination supplies the remaining qualifiers.
        type: string
        default: "iOS Simulator"
      destination:
        description: Destination qualifiers appended after platform.
        type: string
        default: "OS=26.5,name=iPhone 17 Pro Max"
      test-plan:
        description: >
          Optional shared Xcode test plan. Empty uses the scheme's default test action.
          With only-testing and skip-testing this is how a caller scopes a run, for
          example a smoke plan or selection for staging and the full suite for production.
        type: string
        default: ""
      test-iterations:
        description: >
          Attempts in total for a failing test; 0 or 1 runs the tests once. After the
          first attempt, only the tests that failed run again, each attempt in the job's
          freshly erased simulator with a new xcodebuild (scripts/ios-test-retry.py). A
          test that then passes is flaky: it warns, appears in the job summary and the
          flaky-tests output, and does not fail the job. A test that fails every attempt
          fails it. Tests.xcresult, tests.json and summary.json keep the first attempt;
          test-attempts.json records every attempt and the verdict the job follows.
        type: number
        default: 3
      only-testing:
        description: >
          Newline-separated xcodebuild -only-testing identifiers
          (TestTarget[/TestClass[/testMethod]]) to include; empty preserves the
          complete scheme or test plan. A staging caller can name a smoke set here
          while production leaves it empty.
        type: string
        default: ""
      test-selection:
        description: Optional caller-generated JSON selection manifest, retained verbatim with result evidence.
        type: string
        default: ""
      test-evidence-script:
        description: Optional repository-relative Bash script validating exported results. Runs after tests even on failure; nonzero fails the job.
        type: string
        default: ""
      skip-testing:
        description: >
          Newline-separated xcodebuild -skip-testing identifiers
          (TestTarget[/TestClass[/testMethod]]), for excluding specific tests
          from this run — for example a caller keeping an expensive
          XCTMeasureOptions performance test out of the per-PR job while a
          separate nightly caller runs the full scheme. Empty runs everything
          the scheme or test plan already selects. The input is retained in
          skip-testing.txt beside the result bundle.
        type: string
        default: ""
      parallel-testing:
        description: Allow Xcode to run test targets in parallel. Off by default for deterministic UI tests.
        type: boolean
        default: false
      maximum-parallel-testing-workers:
        description: Maximum simulator test workers when parallel testing is enabled; zero lets Xcode decide.
        type: number
        default: 0
      firebase-emulators:
        description: Run the test action inside Firebase Emulator Suite when the app depends on local services.
        type: boolean
        default: false
      firebase-cli-version:
        description: Exact firebase-tools version installed when Firebase emulators are enabled.
        type: string
        default: "15.28.1"
      firebase-config:
        description: Firebase config path relative to the repository root.
        type: string
        default: "firebase.json"
      firebase-project:
        description: Synthetic Firebase project id used by the emulator-backed test run.
        type: string
        default: "demo-ios-ci"
      firebase-only:
        description: Comma-separated Firebase emulators needed by the iOS tests.
        type: string
        default: "auth,firestore"
      pre-test-script:
        description: >
          Optional repository-relative script run immediately before tests, inside emulators
          when enabled. It runs again before each retry, on the erased simulator, with
          RESULTS and LOGS pointing at that attempt's own attempt-<n> directories.
        type: string
        default: ""
      run-tests:
        description: Run every unit and UI test enabled by the shared scheme or selected test plan.
        type: boolean
        default: true
      swift-format-lint:
        description: Lint Swift files changed by this commit with the selected Xcode toolchain's swift-format.
        type: boolean
        default: false
      swift-format-configuration:
        description: swift-format configuration path, relative to working-directory.
        type: string
        default: ".swift-format"
      optimize-test-build:
        description: >
          Override the caller's Debug configuration with the optimization level
          Xcode actually resolves for a configuration named Release (-O for
          Swift, -Os for C/Objective-C, whole-module compilation), CI-only.
          Local Xcode debugging is unaffected — a developer's own Debug build
          never passes this. Measured on Evo: the build itself got faster, not
          slower, and every downstream UI test ran faster too, since Debug's
          default -Onone was the thing making its own graphics-heavy screens
          slow to render under test.
        type: boolean
        default: false
    outputs:
      flaky-tests:
        description: >
          JSON array of test identifiers that failed and then passed on a clean retry;
          [] when none did, empty when tests did not run.
        value: ${{ jobs.test.outputs.flaky-tests }}

permissions:
  contents: read

jobs:
  validate-runner:
    if: ${{ inputs.runner-labels-json != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    concurrency:
      group: ios-ci-runner-labels-${{ github.repository }}-${{ github.workflow }}-${{ inputs.execution-id || github.ref }}-${{ inputs.scheme }}
      cancel-in-progress: ${{ inputs.execution-id == '' }}
    outputs:
      labels: ${{ steps.labels.outputs.labels }}
    steps:
      - name: Validate runner label conjunction
        id: labels
        env:
          RUNNER_LABELS_JSON: ${{ inputs.runner-labels-json }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          const fail = () => {
            console.error('runner-labels-json must be a nonempty JSON array of distinct, nonblank string labels without surrounding whitespace or control characters');
            process.exit(1);
          };
          let labels;
          try { labels = JSON.parse(process.env.RUNNER_LABELS_JSON); }
          catch { fail(); }
          if (!Array.isArray(labels) || labels.length === 0) fail();
          if (!labels.every(label => typeof label === 'string' && label.trim().length > 0 && label === label.trim() && !/[\x00-\x1f\x7f-\x9f]/.test(label))) fail();
          // GitHub runner labels are case-insensitive; do not hide duplicates.
          if (new Set(labels.map(label => label.toLowerCase())).size !== labels.length) fail();
          appendFileSync(process.env.GITHUB_OUTPUT, `labels=${JSON.stringify(labels)}\n`);
          NODE
  test:
    needs: validate-runner
    # A skipped opt-in validator must not skip ordinary callers. A failed or
    # cancelled validator must never select the ordinary runner as a fallback.
    if: ${{ !cancelled() && (inputs.runner-labels-json == '' || needs.validate-runner.result == 'success') }}
    runs-on: ${{ inputs.runner-labels-json == '' && inputs.runner || fromJSON(needs.validate-runner.outputs.labels) }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    # `github.workflow` names the *caller*, which is what separates a pull
    # request's CI run from a release workflow that calls this same job on
    # refs/heads/main. Without it both land in one group and the release's
    # tests can be cancelled by an unrelated push — or cancel it.
    concurrency:
      group: ios-ci-${{ github.repository }}-${{ github.workflow }}-${{ inputs.execution-id || github.ref }}-${{ inputs.scheme }}
      cancel-in-progress: ${{ inputs.execution-id == '' }}
    outputs:
      flaky-tests: ${{ steps.tests.outputs.flaky-tests }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}

    steps:
      - name: Validate execution identity
        working-directory: .
        env:
          SOURCE_SHA: ${{ inputs.source-sha }}
          EXECUTION_ID: ${{ inputs.execution-id }}
        run: |
          set -euo pipefail
          if [[ -n "$SOURCE_SHA" && ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "source-sha must be an exact lowercase 40-character commit hash" >&2
            exit 1
          fi
          if [[ -n "$EXECUTION_ID" ]]; then
            if [[ ! "$EXECUTION_ID" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ || -z "$SOURCE_SHA" ]]; then
              echo "execution-id must be a safe CD effect id with an exact source-sha" >&2
              exit 1
            fi
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source-sha || github.sha }}
          # Scoped PRs need ancestry to verify a merge regenerated after the event.
          # Other callers only need the first parent for the style gate.
          fetch-depth: ${{ github.event_name == 'pull_request' && inputs.watch-paths != '' && '0' || '2' }}
          persist-credentials: false

      - name: Assert checked-out source
        working-directory: .
        env:
          SOURCE_SHA: ${{ inputs.source-sha }}
        run: |
          set -euo pipefail
          if [[ -n "$SOURCE_SHA" && "$(git rev-parse HEAD)" != "$SOURCE_SHA" ]]; then
            echo "Checked-out source does not match source-sha" >&2
            exit 1
          fi

      - name: Check native change scope
        id: scope
        working-directory: .
        env:
          WATCH_PATHS: ${{ inputs.watch-paths }}
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != pull_request ] || [ -z "$WATCH_PATHS" ]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # GitHub can regenerate the merge ref against newer trunk while the
          # event still names its old base. Verify ancestry, but keep the exact head.
          if ! [[ "$PR_BASE_SHA" =~ ^[a-f0-9]{40}$ && "$PR_HEAD_SHA" =~ ^[a-f0-9]{40}$ ]]; then
            echo '::error::Native scope requires valid event base and head SHAs.' >&2
            exit 1
          fi
          read -r -a parents <<< "$(git show -s --format=%P HEAD)"
          if [ "${#parents[@]}" -ne 2 ]; then
            echo '::error::Native scope requires a two-parent PR merge.' >&2
            exit 1
          fi
          merge_base="${parents[0]}"
          merge_head="${parents[1]}"
          echo "Native scope: event base=$PR_BASE_SHA head=$PR_HEAD_SHA; checkout base=$merge_base head=$merge_head"
          if [ "$merge_head" != "$PR_HEAD_SHA" ]; then
            echo '::error::PR merge head does not match event head.' >&2
            exit 1
          fi
          if ! git cat-file -e "$merge_head^{commit}" || ! git merge-base --is-ancestor "$PR_BASE_SHA" "$merge_base"; then
            echo '::error::PR merge base is not descended from event base, or comparison history is missing.' >&2
            exit 1
          fi
          test -n "${WATCH_PATHS//[[:space:]]/}"
          pathspecs=()
          while IFS= read -r pathspec; do
            [ -z "$pathspec" ] || pathspecs+=("$pathspec")
          done <<< "$WATCH_PATHS"
          test "${#pathspecs[@]}" -gt 0
          # Git owns matching, exclusions, deletes and names containing spaces.
          if git diff --quiet --no-renames HEAD^1 HEAD -- "${pathspecs[@]}"; then
            echo 'run=false' >> "$GITHUB_OUTPUT"
            echo 'No native app, dependency or test/build inputs changed; native work skipped.' >> "$GITHUB_STEP_SUMMARY"
          else
            status=$?
            test "$status" -eq 1
            echo 'run=true' >> "$GITHUB_OUTPUT"
          fi

      # A caller's Linux selection job cannot provide a runtime to this job.
      # Persistent macOS service accounts may not have Node on their PATH.
      - name: Set up test evidence runtime
        if: ${{ steps.scope.outputs.run == 'true' && inputs.test-evidence-script != '' }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false

      # GitHub's macos-26 image uses a versioned application name; a dedicated
      # Mac normally uses /Applications/Xcode.app. Accept either layout, then
      # verify the actual toolchain rather than trusting the path's spelling.
      - name: Select Xcode
        if: ${{ steps.scope.outputs.run == 'true' }}
        env:
          XCODE_VERSION: ${{ inputs.xcode-version }}
        run: |
          if [[ ! "$XCODE_VERSION" =~ ^[0-9]+(\.[0-9]+){1,2}$ ]]; then
            echo "xcode-version must be an exact numeric version such as 26.6" >&2
            exit 1
          fi

          versioned_xcode_app="/Applications/Xcode_${XCODE_VERSION}.app"
          if [ -d "$versioned_xcode_app" ]; then
            xcode_app="$versioned_xcode_app"
          elif [ -d /Applications/Xcode.app ]; then
            xcode_app=/Applications/Xcode.app
          else
            echo "Xcode $XCODE_VERSION is not installed on this runner. Installed versions:" >&2
            find /Applications -maxdepth 1 -type d -name 'Xcode*.app' -print >&2
            exit 1
          fi

          installed_version=$("$xcode_app/Contents/Developer/usr/bin/xcodebuild" -version | sed -n '1s/Xcode //p')
          if [ "$installed_version" != "$XCODE_VERSION" ]; then
            echo "Expected Xcode $XCODE_VERSION, but $xcode_app contains $installed_version" >&2
            exit 1
          fi
          echo "DEVELOPER_DIR=$xcode_app/Contents/Developer" >> "$GITHUB_ENV"
          "$xcode_app/Contents/Developer/usr/bin/xcodebuild" -version

      # The post action runs on success, test failure and cancellation. Each job
      # owns its test device and uniquely named XCTest clones, even on a shared Mac.
      # Persistent runners keep one shut-down, dedicated warmed template; tests
      # run only on job-owned clones. Ephemeral hosted runners create a clean device.
      # This workflow's own composite actions, at the revision the caller names. A `uses:` line
      # cannot take an expression, so an action reference inside a reusable workflow is either a
      # branch name, which floats under a consumer's pin (cpheinrich/morpheus#393), or a checkout
      # of the repository at `inputs.actions-ref` used by local path. The checkout is read-only,
      # credential-free (the repository is public), sparse, and lives in its own directory inside
      # the workspace; nothing else in this job reads that directory.
      - name: Validate bounded artifact helper pin
        if: ${{ steps.scope.outputs.run == 'true' }}
        working-directory: .
        env:
          EXECUTION_ID: ${{ inputs.execution-id }}
          ARTIFACT_STAGE_REF: ${{ inputs.artifact-stage-ref }}
        run: |
          if [[ -n "$EXECUTION_ID" && ! "$ARTIFACT_STAGE_REF" =~ ^[a-f0-9]{40}$ ]]; then
            echo 'CD artifact-stage-ref must be an exact reviewed commit' >&2
            exit 1
          fi
      - name: Check out the bounded artifact helper
        if: ${{ steps.scope.outputs.run == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: cpheinrich/morpheus
          ref: ${{ inputs.artifact-stage-ref }}
          path: .morpheus-artifacts
          persist-credentials: false
          sparse-checkout: .github/actions/ios-testflight-upload/artifact-stage

      - name: Check out this workflow's actions
        if: ${{ steps.scope.outputs.run == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: cpheinrich/morpheus
          ref: ${{ inputs.actions-ref }}
          path: .morpheus-ci
          persist-credentials: false
          sparse-checkout: |
            .github/actions
            scripts

      - name: Create isolated test simulator
        if: ${{ steps.scope.outputs.run == 'true' && inputs.run-tests && inputs.platform == 'iOS Simulator' }}
        uses: ./.morpheus-ci/.github/actions/ios-simulator
        with:
          destination: ${{ inputs.destination }}
          persistent: ${{ runner.environment == 'self-hosted' }}

      - name: Validate locked project inputs
        if: ${{ steps.scope.outputs.run == 'true' }}
        env:
          PROJECT: ${{ inputs.project }}
          SCHEME: ${{ inputs.scheme }}
          PARALLEL_TESTING: ${{ inputs.parallel-testing && 'YES' || 'NO' }}
          MAXIMUM_PARALLEL_TESTING_WORKERS: ${{ inputs.maximum-parallel-testing-workers }}
          TEST_ITERATIONS: ${{ inputs.test-iterations }}
          FIREBASE_EMULATORS: ${{ inputs.firebase-emulators }}
          FIREBASE_CLI_VERSION: ${{ inputs.firebase-cli-version }}
          FIREBASE_CONFIG: ${{ inputs.firebase-config }}
          FIREBASE_PROJECT: ${{ inputs.firebase-project }}
          FIREBASE_ONLY: ${{ inputs.firebase-only }}
          PRE_TEST_SCRIPT: ${{ inputs.pre-test-script }}
          TEST_EVIDENCE_SCRIPT: ${{ inputs.test-evidence-script }}
          SWIFT_FORMAT_LINT: ${{ inputs.swift-format-lint }}
          SWIFT_FORMAT_CONFIGURATION: ${{ inputs.swift-format-configuration }}
        run: |
          case "$PROJECT" in
            ""|/*|*".."*)
              echo "project must be a non-empty relative path without '..'" >&2
              exit 1
              ;;
          esac

          if [ ! -d "$PROJECT" ]; then
            echo "Xcode project '$PROJECT' was not found in $PWD" >&2
            exit 1
          fi
          if [ -z "$SCHEME" ]; then
            echo "scheme must not be empty" >&2
            exit 1
          fi
          if [[ ! "$MAXIMUM_PARALLEL_TESTING_WORKERS" =~ ^[0-9]+$ ]]; then
            echo "maximum-parallel-testing-workers must be a non-negative integer" >&2
            exit 1
          fi
          if [ "$PARALLEL_TESTING" != "YES" ] && [ "$MAXIMUM_PARALLEL_TESTING_WORKERS" != "0" ]; then
            echo "maximum-parallel-testing-workers requires parallel-testing" >&2
            exit 1
          fi
          if [[ ! "$TEST_ITERATIONS" =~ ^[0-9]+$ ]]; then
            echo "test-iterations must be a non-negative whole number of attempts" >&2
            exit 1
          fi

          lockfile=$(find . -type f -name Package.resolved -print -quit)
          if [ -z "$lockfile" ]; then
            echo "A checked-in Package.resolved is required for reproducible SwiftPM resolution" >&2
            exit 1
          fi
          git ls-files --error-unmatch -- "$lockfile" >/dev/null || {
            echo "Package.resolved must be committed: $lockfile" >&2
            exit 1
          }

          if [ -n "$PRE_TEST_SCRIPT" ]; then
            case "$PRE_TEST_SCRIPT" in
              /*|*".."*)
                echo "pre-test-script must be relative to the repository root without '..'" >&2
                exit 1
                ;;
            esac
            if [ ! -f "$GITHUB_WORKSPACE/$PRE_TEST_SCRIPT" ]; then
              echo "pre-test-script was not found: $PRE_TEST_SCRIPT" >&2
              exit 1
            fi
          fi

          if [ -n "$TEST_EVIDENCE_SCRIPT" ]; then
            case "$TEST_EVIDENCE_SCRIPT" in
              /*|*".."*) echo "test-evidence-script must be repository-relative without '..'" >&2; exit 1 ;;
            esac
            test -f "$GITHUB_WORKSPACE/$TEST_EVIDENCE_SCRIPT" || exit 1
          fi

          if [ "$SWIFT_FORMAT_LINT" = "true" ]; then
            case "$SWIFT_FORMAT_CONFIGURATION" in
              ""|/*|*".."*)
                echo "swift-format-configuration must be a non-empty path relative to working-directory without '..'" >&2
                exit 1
                ;;
            esac
            if [ ! -f "$SWIFT_FORMAT_CONFIGURATION" ]; then
              echo "swift-format configuration was not found: $SWIFT_FORMAT_CONFIGURATION" >&2
              exit 1
            fi
          fi

          if [ "$FIREBASE_EMULATORS" = "true" ]; then
            case "$FIREBASE_CONFIG" in
              ""|/*|*".."*)
                echo "firebase-config must be a non-empty repository-relative path without '..'" >&2
                exit 1
                ;;
            esac
            if [ ! -f "$GITHUB_WORKSPACE/$FIREBASE_CONFIG" ]; then
              echo "firebase-config was not found: $FIREBASE_CONFIG" >&2
              exit 1
            fi
            if [[ ! "$FIREBASE_CLI_VERSION" =~ ^[0-9]+(\.[0-9]+){2}$ ]]; then
              echo "firebase-cli-version must be an exact semantic version" >&2
              exit 1
            fi
            if [[ ! "$FIREBASE_PROJECT" =~ ^[a-z][a-z0-9-]{4,28}[a-z0-9]$ ]]; then
              echo "firebase-project must be a valid explicit project id" >&2
              exit 1
            fi
            if [[ ! "$FIREBASE_ONLY" =~ ^[a-z]+(,[a-z]+)*$ ]]; then
              echo "firebase-only must be a comma-separated emulator list" >&2
              exit 1
            fi
          fi

      - name: Prepare isolated build directories
        if: ${{ steps.scope.outputs.run == 'true' }}
        id: ios_paths
        run: |
          set -euo pipefail
          # A runner that keeps a build cache between jobs (the Mac mini's
          # ephemeral VMs mount one per repo and slot) names it in
          # MORPHEUS_IOS_CI_CACHE; DerivedData and the package checkouts live
          # there at a path that never changes, so incremental builds survive
          # the VM. Everything else stays under the job's own temp directory.
          ios_ci_root="$RUNNER_TEMP/ios-ci"
          if [ -n "${MORPHEUS_IOS_CI_CACHE:-}" ] && [ -d "$MORPHEUS_IOS_CI_CACHE" ]; then
            cache_root="$MORPHEUS_IOS_CI_CACHE"
            echo "cached=true" >> "$GITHUB_OUTPUT"
          else
            cache_root="$ios_ci_root"
            echo "cached=false" >> "$GITHUB_OUTPUT"
          fi
          mkdir -p "$cache_root/SourcePackages" "$cache_root/DerivedData" "$ios_ci_root"
          # A job cancelled mid-build (the PR group's cancel-in-progress, a VM torn down)
          # leaves the build service's SQLite database half-written on the shared disk, and
          # every later job on that slot then fails before compiling ("no more rows
          # available", "database disk image is malformed", darwin-health/evo 2026-10-13,
          # cpheinrich/morpheus#394). Check it before building and discard only the build
          # products; package checkouts and the module cache are unaffected by it.
          build_db="$cache_root/DerivedData/Build/Intermediates.noindex/XCBuildData/build.db"
          if [ -f "$build_db" ]; then
            integrity=$(sqlite3 -readonly "$build_db" 'PRAGMA quick_check;' 2>&1 | head -n 1 || true)
            if [ "$integrity" != "ok" ]; then
              echo "::warning::Discarding the cached DerivedData build directory: build database check returned '${integrity:-no result}' (a cancelled job on this cache slot); this build starts cold."
              rm -rf "$cache_root/DerivedData/Build"
            fi
          fi
          # Cancellation can leave a child writing after the next job starts.
          # Never reuse or clear its evidence path. The random suffix also
          # separates multiple calls/jobs within the same run and attempt.
          output_root=$(mktemp -d "$ios_ci_root/run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.XXXXXX")
          mkdir -p "$output_root/Results" "$output_root/Logs" "$output_root/Screenshots"
          {
            echo "SOURCE_PACKAGES=$cache_root/SourcePackages"
            echo "DERIVED_DATA=$cache_root/DerivedData"
            echo "RESULTS=$output_root/Results"
            echo "LOGS=$output_root/Logs"
            echo "SCREENSHOTS=$output_root/Screenshots"
          } >> "$GITHUB_ENV"
          {
            echo "results=$output_root/Results"
            echo "logs=$output_root/Logs"
            echo "screenshots=$output_root/Screenshots"
            echo "evidence-name=ios-test-evidence-${output_root##*/}"
          } >> "$GITHUB_OUTPUT"

      # The selection lives in scripts/swift-changed-files.sh, reached through
      # this action, so a consumer wanting the same check locally calls the same
      # file rather than imitating the step below. The first one that imitated
      # it drifted inside a commit (darwin-health/evo#281), and
      # tests/swift-changed-files.test.ts now pins every caller to one list.
      - name: Select changed Swift sources
        id: swift-changed-files
        if: ${{ steps.scope.outputs.run == 'true' && inputs.swift-format-lint }}
        uses: ./.morpheus-ci/.github/actions/swift-changed-files
        with:
          working-directory: ${{ inputs.working-directory }}

      - name: Lint changed Swift sources
        if: ${{ steps.scope.outputs.run == 'true' && inputs.swift-format-lint }}
        env:
          SWIFT_FORMAT_CONFIGURATION: ${{ inputs.swift-format-configuration }}
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
          SWIFT_CHANGED_FILES: ${{ steps.swift-changed-files.outputs.file }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"

          configuration="$GITHUB_WORKSPACE/$WORKING_DIRECTORY/$SWIFT_FORMAT_CONFIGURATION"
          xcrun swift-format --version
          xcrun swift-format dump-configuration \
            --effective \
            --configuration "$configuration" >/dev/null

          swift_files=()
          while IFS= read -r -d '' file; do
            swift_files+=("$file")
          done < "$SWIFT_CHANGED_FILES"

          if [ "${#swift_files[@]}" -eq 0 ]; then
            echo "No changed Swift sources to lint."
            exit 0
          fi

          printf 'Linting %s changed Swift source(s).\n' "${#swift_files[@]}"
          xcrun swift-format lint \
            --configuration "$configuration" \
            --parallel \
            --strict \
            "${swift_files[@]}"

      - name: Cache resolved Swift packages
        # A runner-provided cache directory already keeps the checkouts.
        if: ${{ steps.scope.outputs.run == 'true' && steps.ios_paths.outputs.cached != 'true' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/ios-ci/SourcePackages
          key: swiftpm-${{ runner.os }}-xcode-${{ inputs.xcode-version }}-${{ hashFiles(format('{0}/**/Package.resolved', inputs.working-directory)) }}
          # Without a prefix restore, bumping one dependency in Package.resolved
          # misses the cache entirely and re-clones every package from scratch.
          # A partial hit still leaves the unchanged checkouts in place, and
          # -onlyUsePackageVersionsFromResolvedFile keeps the result exact.
          restore-keys: |
            swiftpm-${{ runner.os }}-xcode-${{ inputs.xcode-version }}-

      - name: Resolve locked Swift packages
        if: ${{ steps.scope.outputs.run == 'true' }}
        env:
          PROJECT: ${{ inputs.project }}
          SCHEME: ${{ inputs.scheme }}
        run: |
          set -o pipefail
          xcodebuild \
            -resolvePackageDependencies \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -clonedSourcePackagesDirPath "$SOURCE_PACKAGES" \
            -onlyUsePackageVersionsFromResolvedFile \
            2>&1 | tee "$LOGS/package-resolution.log"

      - name: Use Java 21 for Firebase emulators
        if: ${{ steps.scope.outputs.run == 'true' && inputs.run-tests && inputs.firebase-emulators }}
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Install the locked Firebase emulator CLI
        if: ${{ steps.scope.outputs.run == 'true' && inputs.run-tests && inputs.firebase-emulators }}
        env:
          FIREBASE_CLI_VERSION: ${{ inputs.firebase-cli-version }}
        run: npm install --global "firebase-tools@$FIREBASE_CLI_VERSION"

      - name: Build for testing
        if: ${{ steps.scope.outputs.run == 'true' && inputs.run-tests }}
        env:
          PROJECT: ${{ inputs.project }}
          SCHEME: ${{ inputs.scheme }}
          CONFIGURATION: ${{ inputs.configuration }}
          SDK: ${{ inputs.sdk }}
          PLATFORM: ${{ inputs.platform }}
          DESTINATION: ${{ inputs.destination }}
          TEST_PLAN: ${{ inputs.test-plan }}
          PARALLEL_TESTING: ${{ inputs.parallel-testing && 'YES' || 'NO' }}
          MAXIMUM_PARALLEL_TESTING_WORKERS: ${{ inputs.maximum-parallel-testing-workers }}
          OPTIMIZE_TEST_BUILD: ${{ inputs.optimize-test-build }}
        run: |
          set -o pipefail
          args=(
            -project "$PROJECT"
            -scheme "$SCHEME"
            -configuration "$CONFIGURATION"
            -sdk "$SDK"
            -destination "platform=$PLATFORM,${MORPHEUS_IOS_DESTINATION:-$DESTINATION}"
            -clonedSourcePackagesDirPath "$SOURCE_PACKAGES"
            -derivedDataPath "$DERIVED_DATA"
            -resultBundlePath "$RESULTS/Build.xcresult"
            -onlyUsePackageVersionsFromResolvedFile
            -disableAutomaticPackageResolution
            -parallel-testing-enabled "$PARALLEL_TESTING"
            # Index-while-building exists to serve Xcode's editor. A CI runner
            # has no editor and discards the store with the machine, so this is
            # compiler work nothing ever reads.
            COMPILER_INDEX_STORE_ENABLE=NO
          )
          if [ -n "$TEST_PLAN" ]; then
            args+=(-testPlan "$TEST_PLAN")
          fi
          if [ "$MAXIMUM_PARALLEL_TESTING_WORKERS" != "0" ]; then
            args+=(-maximum-parallel-testing-workers "$MAXIMUM_PARALLEL_TESTING_WORKERS")
          fi
          if [ "$OPTIMIZE_TEST_BUILD" = "true" ]; then
            # A command-line override beats whatever CONFIGURATION resolves to
            # in the project file, and only reaches this invocation — a
            # developer's own Debug build in Xcode never passes these.
            args+=(SWIFT_OPTIMIZATION_LEVEL=-O SWIFT_COMPILATION_MODE=wholemodule GCC_OPTIMIZATION_LEVEL=s)
          fi
          # One cold retry when the build service itself fails on a damaged shared cache:
          # discard the build directory and build again. A second failure is a real one.
          # `|| status=$?` keeps xcodebuild's own exit status under pipefail and errexit alike.
          status=0
          xcodebuild build-for-testing "${args[@]}" 2>&1 | tee "$LOGS/build.log" || status=$?
          if [ "$status" -ne 0 ]; then
            if grep -qE 'accessing build database|internal inconsistency error' "$LOGS/build.log"; then
              echo "::warning::Build service failure on the cached DerivedData; discarding its build directory and building once more cold."
              rm -rf "$DERIVED_DATA/Build"
              # Keep the failed attempt's evidence under other names: xcodebuild refuses an
              # existing -resultBundlePath, so the retry needs its path free.
              mv "$LOGS/build.log" "$LOGS/build-damaged-cache.log"
              if [ -e "$RESULTS/Build.xcresult" ]; then mv "$RESULTS/Build.xcresult" "$RESULTS/Build-damaged-cache.xcresult"; fi
              xcodebuild build-for-testing "${args[@]}" 2>&1 | tee "$LOGS/build.log"
            else
              exit "$status"
            fi
          fi

      - name: Build
        if: ${{ steps.scope.outputs.run == 'true' && !inputs.run-tests }}
        env:
          PROJECT: ${{ inputs.project }}
          SCHEME: ${{ inputs.scheme }}
          CONFIGURATION: ${{ inputs.configuration }}
          SDK: ${{ inputs.sdk }}
          PLATFORM: ${{ inputs.platform }}
          DESTINATION: ${{ inputs.destination }}
          OPTIMIZE_TEST_BUILD: ${{ inputs.optimize-test-build }}
        run: |
          set -o pipefail
          args=(
            -project "$PROJECT"
            -scheme "$SCHEME"
            -configuration "$CONFIGURATION"
            -sdk "$SDK"
            -destination "platform=$PLATFORM,${MORPHEUS_IOS_DESTINATION:-$DESTINATION}"
            -clonedSourcePackagesDirPath "$SOURCE_PACKAGES"
            -derivedDataPath "$DERIVED_DATA"
            -resultBundlePath "$RESULTS/Build.xcresult"
            -onlyUsePackageVersionsFromResolvedFile
            -disableAutomaticPackageResolution
            COMPILER_INDEX_STORE_ENABLE=NO
          )
          if [ "$OPTIMIZE_TEST_BUILD" = "true" ]; then
            args+=(SWIFT_OPTIMIZATION_LEVEL=-O SWIFT_COMPILATION_MODE=wholemodule GCC_OPTIMIZATION_LEVEL=s)
          fi
          # `|| status=$?` keeps xcodebuild's own exit status under pipefail and errexit alike.
          status=0
          xcodebuild build "${args[@]}" 2>&1 | tee "$LOGS/build.log" || status=$?
          if [ "$status" -ne 0 ]; then
            if grep -qE 'accessing build database|internal inconsistency error' "$LOGS/build.log"; then
              echo "::warning::Build service failure on the cached DerivedData; discarding its build directory and building once more cold."
              rm -rf "$DERIVED_DATA/Build"
              # Keep the failed attempt's evidence under other names: xcodebuild refuses an
              # existing -resultBundlePath, so the retry needs its path free.
              mv "$LOGS/build.log" "$LOGS/build-damaged-cache.log"
              if [ -e "$RESULTS/Build.xcresult" ]; then mv "$RESULTS/Build.xcresult" "$RESULTS/Build-damaged-cache.xcresult"; fi
              xcodebuild build "${args[@]}" 2>&1 | tee "$LOGS/build.log"
            else
              exit "$status"
            fi
          fi

      # Attempt 1 runs the caller's selection. Each retry erases this job's simulator and
      # starts a new xcodebuild for only the tests still failing, so state an earlier test
      # left behind cannot fail the retry too. Retrying inside one xcodebuild session did
      # exactly that: Evo's leftover-state UI failures failed all three in-process
      # iterations. A relaunch per in-process retry (tried 2026-10-04) re-ran the whole UI
      # bundle instead of the failed cases. The logic and its tests live with the script.
      - name: Run unit and UI tests
        id: tests
        if: ${{ steps.scope.outputs.run == 'true' && inputs.run-tests }}
        env:
          PROJECT: ${{ inputs.project }}
          SCHEME: ${{ inputs.scheme }}
          CONFIGURATION: ${{ inputs.configuration }}
          SDK: ${{ inputs.sdk }}
          PLATFORM: ${{ inputs.platform }}
          DESTINATION: ${{ inputs.destination }}
          TEST_PLAN: ${{ inputs.test-plan }}
          ONLY_TESTING: ${{ inputs.only-testing }}
          SKIP_TESTING: ${{ inputs.skip-testing }}
          TEST_ITERATIONS: ${{ inputs.test-iterations }}
          PARALLEL_TESTING: ${{ inputs.parallel-testing && 'YES' || 'NO' }}
          MAXIMUM_PARALLEL_TESTING_WORKERS: ${{ inputs.maximum-parallel-testing-workers }}
          FIREBASE_EMULATORS: ${{ inputs.firebase-emulators }}
          FIREBASE_CONFIG: ${{ inputs.firebase-config }}
          FIREBASE_PROJECT: ${{ inputs.firebase-project }}
          FIREBASE_ONLY: ${{ inputs.firebase-only }}
          PRE_TEST_SCRIPT: ${{ inputs.pre-test-script }}
        run: |
          set -o pipefail
          retry="$GITHUB_WORKSPACE/.morpheus-ci/scripts/ios-test-retry.py"
          if [ ! -f "$retry" ]; then
            echo "::error::actions-ref has no scripts/ios-test-retry.py; pass the same Morpheus commit as this workflow's pin." >&2
            exit 1
          fi
          # The script runs the pre-test script and writes tests.log itself, once per attempt.
          if [ "$FIREBASE_EMULATORS" = "true" ]; then
            printf -v test_command 'python3 -I -S -B %q' "$retry"
            firebase emulators:exec \
              --config "$GITHUB_WORKSPACE/$FIREBASE_CONFIG" \
              --project "$FIREBASE_PROJECT" \
              --only "$FIREBASE_ONLY" \
              "$test_command" \
              2>&1 | tee "$LOGS/emulators.log"
          else
            python3 -I -S -B "$retry"
          fi

      - name: Export complete test evidence
        if: ${{ steps.scope.outputs.run == 'true' && always() && inputs.run-tests && steps.ios_paths.outcome == 'success' }}
        env:
          EXECUTION_ID: ${{ inputs.execution-id }}
          TEST_SELECTION: ${{ inputs.test-selection }}
          ONLY_TESTING: ${{ inputs.only-testing }}
          SKIP_TESTING: ${{ inputs.skip-testing }}
          TEST_EVIDENCE_SCRIPT: ${{ inputs.test-evidence-script }}
        run: |
          set -euo pipefail
          git rev-parse HEAD > "$RESULTS/tested-sha.txt"
          if [[ -n "${EXECUTION_ID:-}" ]]; then
            python3 - <<'PYTHON'
          import json, os, pathlib
          root = pathlib.Path(os.environ["RESULTS"])
          data = dict(schemaVersion=1, sourceSha=(root / "tested-sha.txt").read_text().strip(),
                      executionId=os.environ["EXECUTION_ID"], runId=os.environ["GITHUB_RUN_ID"],
                      runAttempt=os.environ["GITHUB_RUN_ATTEMPT"])
          (root / "execution.json").write_text(json.dumps(data) + "\n")
          PYTHON
          fi
          printf '%s\n' "$TEST_SELECTION" > "$RESULTS/selection.json"
          printf '%s\n' "$ONLY_TESTING" > "$RESULTS/only-testing.txt"
          printf '%s\n' "$SKIP_TESTING" > "$RESULTS/skip-testing.txt"
          result_bundle="$RESULTS/Tests.xcresult"
          if [ -d "$result_bundle" ]; then
            xcrun xcresulttool get test-results tests --path "$result_bundle" > "$RESULTS/tests.json"
            xcrun xcresulttool get test-results summary --path "$result_bundle" > "$RESULTS/summary.json"
          fi
          if [ -n "$TEST_EVIDENCE_SCRIPT" ]; then
            bash "$GITHUB_WORKSPACE/$TEST_EVIDENCE_SCRIPT"
          fi

      - name: Export rendered test attachments
        if: ${{ steps.scope.outputs.run == 'true' && always() && inputs.run-tests && steps.ios_paths.outcome == 'success' }}
        run: |
          set -o pipefail
          result_bundle="$RESULTS/Tests.xcresult"
          if [ ! -d "$result_bundle" ]; then
            echo "No test result bundle exists; there are no rendered attachments to export."
            exit 0
          fi

          if ! xcrun xcresulttool export attachments \
            --path "$result_bundle" \
            --output-path "$SCREENSHOTS" \
            2>&1 | tee "$LOGS/attachments.log"; then
            echo "::warning title=Rendered attachments unavailable::xcresulttool could not export test attachments"
          fi

      - name: Collect Firebase emulator diagnostics
        if: ${{ steps.scope.outputs.run == 'true' && always() && inputs.run-tests && inputs.firebase-emulators && steps.ios_paths.outcome == 'success' }}
        run: |
          candidate_logs=(
            "$GITHUB_WORKSPACE/firebase-debug.log"
            "$PWD/firebase-debug.log"
          )
          for candidate in "${candidate_logs[@]}"; do
            if [ -f "$candidate" ]; then
              cp "$candidate" "$LOGS/firebase-debug.log"
              exit 0
            fi
          done
          echo "Firebase did not produce a debug log."

      - name: Capture native failure before artifact staging
        id: native_failure
        if: ${{ steps.scope.outputs.run == 'true' && failure() }}
        run: echo 'failed=true' >> "$GITHUB_OUTPUT"

      - name: Stage bounded native-screenshots
        id: artifact_screenshots
        if: ${{ steps.scope.outputs.run == 'true' && always() && inputs.run-tests && steps.ios_paths.outcome == 'success' }}
        uses: ./.morpheus-artifacts/.github/actions/ios-testflight-upload/artifact-stage
        with:
          channel: native-screenshots

      - name: Stage bounded native-complete-evidence
        id: artifact_complete
        if: ${{ steps.scope.outputs.run == 'true' && always() && inputs.run-tests && steps.ios_paths.outcome == 'success' }}
        uses: ./.morpheus-artifacts/.github/actions/ios-testflight-upload/artifact-stage
        with:
          channel: native-complete-evidence

      - name: Stage bounded native-failure-evidence
        id: artifact_failure
        if: ${{ steps.scope.outputs.run == 'true' && always() && steps.native_failure.outputs.failed == 'true' && steps.ios_paths.outcome == 'success' }}
        uses: ./.morpheus-artifacts/.github/actions/ios-testflight-upload/artifact-stage
        with:
          channel: native-failure-evidence

      - name: Require all selected native artifact admissions
        id: artifact_barrier
        if: ${{ steps.scope.outputs.run == 'true' && always() && steps.ios_paths.outcome == 'success' }}
        env:
          RUN_TESTS: ${{ inputs.run-tests }}
          SCREENSHOT_STAGE: ${{ steps.artifact_screenshots.outcome }}
          COMPLETE_STAGE: ${{ steps.artifact_complete.outcome }}
          FAILURE_STAGE: ${{ steps.artifact_failure.outcome }}
        run: |
          set -euo pipefail
          if [[ "$RUN_TESTS" == true ]]; then
            test "$SCREENSHOT_STAGE" = success
            test "$COMPLETE_STAGE" = success
          else
            test "$SCREENSHOT_STAGE" = skipped
            test "$COMPLETE_STAGE" = skipped
          fi
          [[ "$FAILURE_STAGE" == success || "$FAILURE_STAGE" == skipped ]]

      - name: Upload rendered test attachments
        if: ${{ steps.scope.outputs.run == 'true' && always() && inputs.run-tests && steps.ios_paths.outcome == 'success' && steps.artifact_screenshots.outcome == 'success' && steps.artifact_screenshots.outputs.admitted == 'true' && steps.artifact_screenshots.outputs.has-files == 'true' && steps.artifact_barrier.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ios-screenshots-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.artifact_screenshots.outputs.payload-root }}
          if-no-files-found: ignore
          retention-days: 14
          archive: true
          compression-level: 0
          overwrite: false

      - name: Upload complete test evidence
        if: ${{ steps.scope.outputs.run == 'true' && always() && inputs.run-tests && steps.ios_paths.outcome == 'success' && steps.artifact_complete.outcome == 'success' && steps.artifact_complete.outputs.admitted == 'true' && steps.artifact_complete.outputs.has-files == 'true' && steps.artifact_barrier.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ inputs.execution-id != '' && format('ios-test-evidence-{0}', inputs.execution-id) || steps.ios_paths.outputs.evidence-name }}
          path: ${{ steps.artifact_complete.outputs.payload-root }}
          if-no-files-found: error
          retention-days: 30
          archive: true
          compression-level: 0
          overwrite: false

      - name: Upload Xcode failure evidence
        if: ${{ steps.scope.outputs.run == 'true' && always() && steps.native_failure.outputs.failed == 'true' && steps.ios_paths.outcome == 'success' && steps.artifact_failure.outcome == 'success' && steps.artifact_failure.outputs.admitted == 'true' && steps.artifact_failure.outputs.has-files == 'true' && steps.artifact_barrier.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ios-ci-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.artifact_failure.outputs.payload-root }}
          if-no-files-found: warn
          retention-days: 14
          archive: true
          compression-level: 0
          overwrite: false
