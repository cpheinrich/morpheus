name: Security import review

# Review-only use of the existing Manager App and Claude subscription. The
# private Manager caller owns the schedule and credentials; this workflow is
# pinned to an exact Morpheus commit and is inert until called there.
on:
  workflow_call:
    inputs:
      morpheus-sha:
        type: string
        required: true
    secrets:
      app_id:
        required: true
      app_private_key:
        required: true
      claude_code_oauth_token:
        required: true

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      pulls: ${{ steps.candidates.outputs.pulls }}
    steps:
      - name: Mint a read-only Morpheus token
        id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.app_id }}
          private-key: ${{ secrets.app_private_key }}
          owner: cpheinrich
          repositories: morpheus
          permission-contents: read
          permission-pull-requests: read
          permission-issues: read
          permission-checks: read
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: cpheinrich/morpheus
          ref: ${{ inputs.morpheus-sha }}
          path: tooling
          fetch-depth: 1
          persist-credentials: false
      - name: Require immutable reviewed tooling
        env:
          MORPHEUS_SHA: ${{ inputs.morpheus-sha }}
        run: |
          printf '%s' "$MORPHEUS_SHA" | grep -Eq '^[0-9a-f]{40}$'
          test "$(git -C tooling rev-parse HEAD)" = "$MORPHEUS_SHA"
      - name: Select only attested, opted-in import candidates
        id: candidates
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: node tooling/scripts/security-import-review.mjs discover

  review:
    needs: discover
    if: needs.discover.outputs.pulls != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        pr: ${{ fromJSON(needs.discover.outputs.pulls) }}
    steps:
      - name: Mint a read-only reviewer token
        id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.app_id }}
          private-key: ${{ secrets.app_private_key }}
          owner: cpheinrich
          repositories: morpheus
          permission-contents: read
          permission-pull-requests: read
          permission-issues: read
          permission-checks: read
          permission-statuses: read
          permission-actions: read
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: cpheinrich/morpheus
          ref: ${{ inputs.morpheus-sha }}
          path: tooling
          fetch-depth: 1
          persist-credentials: false
      - name: Require immutable reviewed tooling
        env:
          MORPHEUS_SHA: ${{ inputs.morpheus-sha }}
        run: test "$(git -C tooling rev-parse HEAD)" = "$MORPHEUS_SHA"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: cpheinrich/morpheus
          ref: refs/pull/${{ matrix.pr }}/head
          path: target
          fetch-depth: 0
          token: ${{ steps.token.outputs.token }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: target/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install target dependencies without lifecycle scripts
        working-directory: target
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install the pinned reviewer before exposing a credential
        run: npm install --global '@anthropic-ai/claude-code@2.1.287'
      - name: Prepare an exact-head, read-only review brief
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          SECURITY_REVIEW_DECISION: ${{ runner.temp }}/decision-${{ matrix.pr }}.json
          PR: ${{ matrix.pr }}
        run: node tooling/scripts/security-import-review.mjs prompt "$PR" "$RUNNER_TEMP/prompt-$PR.md"
      - name: Review without write access to Morpheus
        id: session
        working-directory: target
        timeout-minutes: 30
        continue-on-error: true
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.claude_code_oauth_token }}
          GH_TOKEN: ${{ steps.token.outputs.token }}
          PR: ${{ matrix.pr }}
          DISABLE_AUTOUPDATER: '1'
        run: |
          claude --print --model claude-opus-5-5 --output-format json --dangerously-skip-permissions \
            < "$RUNNER_TEMP/prompt-$PR.md" > "$RUNNER_TEMP/result-$PR.json"
      - name: Hand the review result to a separate verifier
        if: always()
        env:
          PR: ${{ matrix.pr }}
        run: |
          test -f "$RUNNER_TEMP/decision-$PR.json" || printf '{}' > "$RUNNER_TEMP/decision-$PR.json"
          test -f "$RUNNER_TEMP/result-$PR.json" || printf '{"is_error":true}' > "$RUNNER_TEMP/result-$PR.json"
      - name: Upload the review result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: security-import-review-${{ matrix.pr }}
          path: |
            ${{ runner.temp }}/decision-${{ matrix.pr }}.json
            ${{ runner.temp }}/result-${{ matrix.pr }}.json
          if-no-files-found: ignore
          retention-days: 30

  apply:
    needs: [discover, review]
    if: always() && needs.discover.result == 'success' && needs.discover.outputs.pulls != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: security-import-review-apply
      cancel-in-progress: false
    steps:
      - name: Mint a comment-only Manager token
        id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.app_id }}
          private-key: ${{ secrets.app_private_key }}
          owner: cpheinrich
          repositories: morpheus
          permission-contents: read
          permission-pull-requests: read
          permission-issues: write
          permission-checks: read
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: cpheinrich/morpheus
          ref: ${{ inputs.morpheus-sha }}
          path: tooling
          fetch-depth: 1
          persist-credentials: false
      - name: Require immutable reviewed tooling
        env:
          MORPHEUS_SHA: ${{ inputs.morpheus-sha }}
        run: test "$(git -C tooling rev-parse HEAD)" = "$MORPHEUS_SHA"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: security-import-review-*
          path: reviews
          merge-multiple: true
      - name: Verify and publish exact-head review results
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          PULLS: ${{ needs.discover.outputs.pulls }}
        run: |
          set -euo pipefail
          for pr in $(jq -r '.[]' <<< "$PULLS"); do
            node tooling/scripts/security-import-review.mjs apply "$pr" "reviews/decision-$pr.json" "reviews/result-$pr.json"
          done
