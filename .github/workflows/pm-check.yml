name: PM check

# Reusable workflow. Validates hq/product/ frontmatter against the kit's schemas
# and verifies the generated README indexes are current.
#
#   jobs:
#     pm:
#       uses: cpheinrich/morpheus/.github/workflows/pm-check.yml@main
#       with:
#         product-dir: hq/product

on:
  workflow_call:
    inputs:
      product-dir:
        type: string
        default: "hq/product"
      standup-dir:
        description: Set to "" to skip standup validation.
        type: string
        default: "hq/standup"
      morpheus-ref:
        type: string
        default: "main"
      node-version:
        type: string
        default: "22"
      pnpm-version:
        type: string
        default: "11.9.0"

jobs:
  pm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The consuming repo does not depend on morpheus-kit — the package is not
      # published, and a project should not need it installed just to validate
      # its own markdown. Check the CLI out and build it instead.
      - uses: actions/checkout@v4
        with:
          repository: cpheinrich/morpheus
          ref: ${{ inputs.morpheus-ref }}
          path: .morpheus

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ inputs.pnpm-version }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}

      - name: Build the Morpheus CLI
        working-directory: .morpheus
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Validate frontmatter
        run: node .morpheus/dist/cli/index.js pm validate --dir ${{ inputs.product-dir }}

      # --check writes nothing; it fails if regenerating would change anything,
      # so a stale index cannot be merged.
      - name: Verify indexes are current
        run: node .morpheus/dist/cli/index.js pm index --dir ${{ inputs.product-dir }} --check

      # Enforces the standup invariants — an open item must offer a reply slot,
      # a closed one must not, numbering must be dense, summary must come first.
      - name: Validate standups
        if: ${{ inputs.standup-dir != '' }}
        run: node .morpheus/dist/cli/index.js standup validate --dir ${{ inputs.standup-dir }}
