name: PM check

# Reusable workflow. Validates hq/product/ frontmatter against the kit's schemas
# retires any legacy generated roadmap table, and verifies the remaining indexes are current.
#
#   jobs:
#     pm:
#       uses: cpheinrich/morpheus/.github/workflows/pm-check.yml@main
#       with:
#         product-dir: hq/product

on:
  workflow_call:
    inputs:
      product-dir:
        type: string
        default: "hq/product"
      inbox-dir:
        description: Set to "" to skip inbox validation.
        type: string
        default: "hq/team"
      hq-rules-path:
        description: Path to firestore.rules; leave empty to skip the generated-helper check.
        type: string
        default: ""
      morpheus-ref:
        type: string
        default: "main"
      node-version:
        type: string
        default: "22"
      pnpm-version:
        description: >
          Leave empty to let Morpheus's own `packageManager` field decide.
          Setting both makes pnpm/action-setup fail with "Multiple versions of
          pnpm specified".
        type: string
        default: ""

jobs:
  pm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # The consuming repo does not depend on morpheus-kit — the package is not
      # published, and a project should not need it installed just to validate
      # its own markdown. Check the CLI out and build it instead.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: cpheinrich/morpheus
          ref: ${{ inputs.morpheus-ref }}
          path: .morpheus

      # Read the version from Morpheus's own manifest, not the consuming
      # repo's. `pnpm/action-setup` looks at the repository root by default,
      # and the consumer may have no package.json at all — two of ours do not.
      # This failed everywhere except Morpheus itself, which is the only place
      # the workflow was ever exercised before today.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ inputs.pnpm-version }}
          package_json_file: .morpheus/package.json

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ inputs.node-version }}

      - name: Install the Morpheus CLI runtime
        working-directory: .morpheus
        run: pnpm install --frozen-lockfile

      # Projects without Firestore rules should not gain a failing check merely
      # by updating @main. Consumers with the data gate opt in, while reusing
      # the checkout and build this job has already paid for.
      - name: Verify generated HQ role helpers
        if: inputs.hq-rules-path != ''
        env:
          MORPHEUS_RULES_PATH: ${{ inputs.hq-rules-path }}
        run: node .morpheus/dist/cli/index.js hq rules --check --rules-path "$MORPHEUS_RULES_PATH"

      - name: Validate frontmatter
        run: node .morpheus/dist/cli/index.js pm validate --dir ${{ inputs.product-dir }}

      # --check writes nothing. It fails on a legacy roadmap table or stale
      # goal/request index; after migration, the roadmap README stays static.
      - name: Verify product READMEs are current
        run: node .morpheus/dist/cli/index.js pm index --dir ${{ inputs.product-dir }} --check

      # Enforces the inbox invariants — an open item must offer a reply slot,
      # a closed one must not, numbering must be dense, summary must come first.
      - name: Validate inboxes
        if: ${{ inputs.inbox-dir != '' }}
        run: node .morpheus/dist/cli/index.js inbox validate --dir ${{ inputs.inbox-dir }}

      # The roster and every meeting note. Separate from `inbox validate`
      # because a project can legitimately have one and not the other, and a
      # note that skipped its redaction pass must not reach `main`.
      - name: Team
        if: inputs.inbox-dir != ''
        run: node .morpheus/dist/cli/index.js team validate
