name: Security remediation

on:
  schedule:
    - cron: "43 10 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  remediate:
    uses: cpheinrich/morpheus-security/.github/workflows/security-remediation.yml@2a6bb31e7693ffe79eaceda148974a7277f66ffc
    with:
      security-sha: 2a6bb31e7693ffe79eaceda148974a7277f66ffc
      config-file: .github/morpheus-security.json
    secrets:
      app_id: ${{ secrets.MORPHEUS_SECURITY_APP_ID }}
      app_private_key: ${{ secrets.MORPHEUS_SECURITY_PRIVATE_KEY }}
