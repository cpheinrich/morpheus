name: Security remediation

on:
  schedule:
    - cron: "43 10 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  remediate:
    uses: cpheinrich/morpheus-security/.github/workflows/security-remediation.yml@f6031dfaa67b22cb041cab9148dc3fc729ccd2c1
    with:
      security-sha: f6031dfaa67b22cb041cab9148dc3fc729ccd2c1
      config-file: .github/morpheus-security.json
    secrets:
      app_id: ${{ secrets.MORPHEUS_SECURITY_APP_ID }}
      app_private_key: ${{ secrets.MORPHEUS_SECURITY_PRIVATE_KEY }}
