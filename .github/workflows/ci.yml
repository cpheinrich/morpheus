name: CI

# Morpheus's own CI — it calls the same reusable workflows it ships to projects.
# If they break, they break here first.

on:
  push:
    branches: [main]
  pull_request:
    # Spelled out only to add `ready_for_review`; the other three are the
    # default set. The list is load-bearing rather than decorative — rung 2
    # below keys off which of these fired, and a draft being marked ready is
    # the moment a review is wanted most.
    types: [opened, reopened, synchronize, ready_for_review]

jobs:
  codex-claude:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Test optional Claude bridge without model calls
        working-directory: plugins/codex-claude
        run: |
          pnpm install --ignore-workspace --frozen-lockfile
          pnpm check
          pnpm test

  node:
    uses: ./.github/workflows/node-ci.yml
    with:
      run-lint: true
      build-script: compile
      verify-build-clean: true
      build-output-directory: dist

  qa-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium webkit
      - name: Run browser QA tests
        id: qa_tests
        run: pnpm test:qa-browser
      - name: Stage bounded browser failure traces
        id: artifact_ci_trace
        if: ${{ failure() && steps.qa_tests.outcome == 'failure' }}
        run: python3 -I -S -B .github/actions/ios-testflight-upload/artifact-stage/ci_trace_stage.py --github
      - name: Upload admitted browser failure traces
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ failure() && steps.qa_tests.outcome == 'failure' && steps.artifact_ci_trace.outcome == 'success' && steps.artifact_ci_trace.outputs.admitted == 'true' && steps.artifact_ci_trace.outputs.has-files == 'true' }}
        with:
          name: qa-browser-traces
          path: ${{ steps.artifact_ci_trace.outputs.payload-root }}
          if-no-files-found: error
          retention-days: 1
          archive: true
          compression-level: 0
          overwrite: false

  # This is synthetic transport qualification, never native test evidence.
  artifact-abi:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.14']
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a
        with:
          enable-cache: false
      - name: Qualify actual interpreter and focused artifact tests
        run: |
          set -euo pipefail
          node -e 'if (process.versions.node.split(".")[0] !== "24") process.exit(1); console.log(JSON.stringify({node:process.versions.node,run:process.env.GITHUB_RUN_ID,attempt:process.env.GITHUB_RUN_ATTEMPT,sha:process.env.GITHUB_SHA,job:process.env.GITHUB_JOB,runner:process.env.RUNNER_NAME}));'
          uv python install "$UV_PYTHON"
          uv run --no-project python -I -S -B tests/artifacts/test_stage.py
          uv run --no-project python -I -S -B tests/artifacts/test_ci_trace.py
          uv run --no-project python -I -S -B tests/artifacts/test_processing_environment.py
          uv run --no-project python -I -S -B tests/artifacts/test_abi_fixture.py
      - name: Stage fixed 2 MiB ABI fixture
        id: artifact_abi
        run: uv run --no-project python -I -S -B tests/artifacts/abi_fixture.py prepare
      - name: Upload admitted ABI fixture with actual Node 24 action
        if: ${{ success() && steps.artifact_abi.outcome == 'success' && steps.artifact_abi.outputs.admitted == 'true' && steps.artifact_abi.outputs.has-files == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: artifact-abi-fixture-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.python }}
          path: ${{ steps.artifact_abi.outputs.payload-root }}
          if-no-files-found: error
          retention-days: 1
          archive: true
          compression-level: 0
          overwrite: false
      - name: Download through normal archive-compatible downloader
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: artifact-abi-fixture-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.python }}
          path: ${{ runner.temp }}/artifact-abi-readback
      - name: Verify complete independent fixture bytes
        run: uv run --no-project python -I -S -B tests/artifacts/abi_fixture.py verify

  # Morpheus has the CLI in-tree, so it validates directly rather than via the
  # reusable workflow (which checks the CLI out of this very repo).
  pm:
    uses: ./.github/workflows/pm-check.yml
    with:
      product-dir: hq/product
      morpheus-ref: ${{ github.sha }}

  pr:
    # An unreviewed draft waits instead of failing: skipped here, at the
    # caller, the required `pr / conventions` is left unreported, which blocks
    # merge without going red. A skip inside pr-check.yml would report it as
    # skipped, which satisfies protection. Labelling the draft or marking it
    # ready runs the full check. Kept equal to PR_CHECK_CALLER_IF in
    # src/init/templates.ts by tests/workflows.test.ts.
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft || contains(github.event.pull_request.labels.*.name, 'agent-reviewed') || contains(github.event.pull_request.labels.*.name, 'manager-reviewed') }}
    # The reusable check reads the live pull request through the job token;
    # a called workflow can only narrow what its caller grants.
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/pr-check.yml
    with:
      product-dir: hq/product
      # Build the checker from *this* commit, as `pm` and `agent-review` above
      # already do. Defaulting to `main` meant Morpheus validated its own PRs
      # with main's CLI: a fix to `check pr` could never prove itself, and a PR
      # that broke `check pr` would still pass its own conventions check. Found
      # when MO-057's new id format made main's branch parser return `MO-2026`.
      morpheus-ref: ${{ github.sha }}

  # Verifier rung 2. Advisory by design — it never blocks the merge, and it
  # reports itself as skipped rather than green when no key is configured.
  agent-review:
    uses: ./.github/workflows/agent-review.yml
    # No `if:` here, deliberately — the review-once-on-open decision lives in
    # the called workflow's gate, not in this caller. A caller-level skip on
    # `synchronize` leaves the nested `agent-review / delivery` check
    # *unreported* rather than skipped, and an unreported required check blocks
    # the merge forever. Inside the workflow the same skip is a job-level one,
    # which GitHub reports as skipped — and a skipped required check is
    # satisfied. Per-push reviews stay available to any consumer that sets
    # `synchronize-reviews: true`.
    # A called workflow cannot request more than its caller was granted, and a
    # caller job with no `permissions` block gets the repository default —
    # read-only here. Without this the *entire* workflow file is rejected and
    # nothing runs: "The nested job 'review' is requesting 'pull-requests:
    # write', but is only allowed 'pull-requests: none'." Took down all of CI
    # on the first push of this branch.
    permissions:
      contents: read
      pull-requests: write
    with:
      # Temporarily off for Morpheus. Keep the reusable workflow call in CI so
      # `agent-review / delivery` is reported as skipped and continues to
      # satisfy the repository's required-check protection.
      enabled: false
      product-dir: hq/product
      morpheus-ref: ${{ github.sha }}
    secrets:
      claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
