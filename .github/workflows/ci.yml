name: CI

# Morpheus's own CI — it calls the same reusable workflows it ships to projects.
# If they break, they break here first.

on:
  push:
    branches: [main]
  pull_request:
    # Spelled out only to add `ready_for_review`; the other three are the
    # default set. The list is load-bearing rather than decorative — rung 2
    # below keys off which of these fired, and a draft being marked ready is
    # the moment a review is wanted most.
    types: [opened, reopened, synchronize, ready_for_review]

jobs:
  node:
    uses: ./.github/workflows/node-ci.yml
    with:
      run-lint: true
      build-script: compile
      verify-build-clean: true
      build-output-directory: dist

  # Morpheus has the CLI in-tree, so it validates directly rather than via the
  # reusable workflow (which checks the CLI out of this very repo).
  pm:
    uses: ./.github/workflows/pm-check.yml
    with:
      product-dir: hq/product
      morpheus-ref: ${{ github.sha }}

  pr:
    uses: ./.github/workflows/pr-check.yml
    with:
      product-dir: hq/product
      # Build the checker from *this* commit, as `pm` and `agent-review` above
      # already do. Defaulting to `main` meant Morpheus validated its own PRs
      # with main's CLI: a fix to `check pr` could never prove itself, and a PR
      # that broke `check pr` would still pass its own conventions check. Found
      # when MO-057's new id format made main's branch parser return `MO-2026`.
      morpheus-ref: ${{ github.sha }}

  # Verifier rung 2. Advisory by design — it never blocks the merge, and it
  # reports itself as skipped rather than green when no key is configured.
  agent-review:
    uses: ./.github/workflows/agent-review.yml
    # No `if:` here, deliberately — the review-once-on-open decision lives in
    # the called workflow's gate, not in this caller. A caller-level skip on
    # `synchronize` leaves the nested `agent-review / delivery` check
    # *unreported* rather than skipped, and an unreported required check blocks
    # the merge forever. Inside the workflow the same skip is a job-level one,
    # which GitHub reports as skipped — and a skipped required check is
    # satisfied. Per-push reviews stay available to any consumer that sets
    # `synchronize-reviews: true`.
    # A called workflow cannot request more than its caller was granted, and a
    # caller job with no `permissions` block gets the repository default —
    # read-only here. Without this the *entire* workflow file is rejected and
    # nothing runs: "The nested job 'review' is requesting 'pull-requests:
    # write', but is only allowed 'pull-requests: none'." Took down all of CI
    # on the first push of this branch.
    permissions:
      contents: read
      pull-requests: write
    with:
      # Temporarily off for Morpheus. Keep the reusable workflow call in CI so
      # `agent-review / delivery` is reported as skipped and continues to
      # satisfy the repository's required-check protection.
      enabled: false
      product-dir: hq/product
      morpheus-ref: ${{ github.sha }}
    secrets:
      claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
