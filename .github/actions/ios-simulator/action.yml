name: Owned iOS simulator
description: Create an isolated test destination and reclaim it and its XCTest clones in the job post phase.
inputs:
  destination:
    description: Existing iOS simulator destination, using name and OS or id.
    required: true
  persistent:
    description: Clone one warmed Morpheus template on a persistent self-hosted runner.
    required: false
    default: "false"
runs:
  using: node24
  main: main.mjs
  post: post.mjs
  post-if: always()
